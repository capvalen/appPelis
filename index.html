<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peliteca - Infocat</title>
  <link rel="icon" type="image/png" href="/assets/martian.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
	<link rel="manifest" href="/manifest.json">
<style>
  :root {
    --morado: #965bef;
    --morado-oscuro: #7a3fd0;
    --morado-suave: #ae7bf2;
    --morado-claro: #e9dcfb;
    --morado-claro-hover: #dcc9f9;
    --morado-mas-claro: #f4eefd;
    --texto: #1f2937;
    --texto-suave: #6b7280;
    --borde: #e5e7eb;
    --rojo: #dc2626;
    /* tema oscuro */
    --fondo: #ffffff;
    --superficie: #ffffff;
    --superficie-suave: #f3f4f6;
    --superficie-2: #f9fafb;
  }
  html.tema-oscuro {
    --fondo: #06041F;
    --superficie: #1a1e2a;
    --superficie-suave: #262b3b;
    --superficie-2: #20242f;
    --texto: #e5e7eb;
    --texto-suave: #9ca3af;
    --borde: #2c3244;
    --morado: #6152ff;
    --morado-oscuro: #c4b5fd;
    --morado-suave: #7c5cd6;
    --morado-claro: #3b3561;
    --morado-claro-hover: #473f6e;
    --morado-mas-claro: #2c2846;
    --rojo: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  header {
    position: relative;
    background: var(--superficie);
    color: var(--morado);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(150, 91, 239, .18);
  }
  header h1 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--morado);
    text-align: center;
    white-space: nowrap;
  }
  header .logo { height: 40px; width: auto; border-radius: 8px; }
  header h1 span { font-weight: 400; opacity: .8; }
  html.tema-oscuro header {
    background: #06041f;
    box-shadow: none;
  }
  .btn-config {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    color: #6152ff;
    text-decoration: none;
    transition: background .15s, transform .05s;
  }
  .btn-config:hover { background: var(--morado-claro); }
  .btn-config i { font-size: 1.35rem; }
  .toolbar {
    max-width: 1100px;
    margin: 24px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .carrusel-wrap {
    position: relative;
    max-width: 1100px;
    margin: 24px auto 0;
    padding: 0 24px;
  }
  .carrusel-titulo {
    font-size: .85rem;
    color: #6458e0;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .carrusel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--superficie);
    color: #6152ff;
    border: 1px solid var(--borde);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
  }
  .carrusel-btn:hover { background: var(--morado-claro); }
  .carrusel-btn i { font-size: 1.3rem; display: block; }
  .carrusel-btn.prev { left: 0; margin-left: 8px; }
  .carrusel-btn.next { right: 0; margin-right: 8px; }
  .carrusel {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel .carrusel-item {
    flex: 0 0 auto;
    scroll-snap-align: start;
    cursor: pointer;
    transition: transform .15s;
  }
  .carrusel .carrusel-item:hover { transform: scale(1.05); }
  .carrusel .carrusel-item img {
    height: 180px;
    width: auto;
    object-fit: cover;
    border-radius: 8px;
  }
  @media (max-width: 640px) {
    .carrusel .carrusel-item {
      width: calc((100% - 20px) / 3);
    }
    .carrusel .carrusel-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
    }
  }
  @media (min-width: 641px) {
    .carrusel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }
    .carrusel .carrusel-item {
      flex: 0 0 calc((100% - 40px) / 5);
      scroll-snap-align: start;
    }
    .carrusel .carrusel-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
    }
  }
  input[type="text"], input[type="number"], select, textarea {
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .95rem;
    color: var(--texto);
    background: var(--superficie);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    border-color: var(--morado);
    box-shadow: 0 0 0 3px var(--morado-claro);
  }
  #buscar { flex: 1; min-width: 220px; }
  .buscar-wrap { position: relative; flex: 1; min-width: 220px; display: flex; }
  .buscar-wrap input { flex: 1; padding-right: 36px; }
  .buscar-wrap .btn-limpiar {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    color: var(--texto-suave);
    padding: 4px;
    font-size: .95rem;
    border-radius: 6px;
  }
  .buscar-wrap .btn-limpiar:hover { background: var(--morado-claro); color: var(--morado-oscuro); }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:active { transform: scale(.97); }
  .btn-primario { background: var(--morado); color: #fff; }
  .btn-primario:hover { background: var(--morado-oscuro); }
  .btn-secundario { background: var(--morado-claro); color: var(--morado-oscuro); }
  .btn-secundario:hover { background: var(--morado-claro-hover); }
  .btn-volver {
    background: var(--superficie);
    color: var(--texto-suave);
    border: 1px solid var(--borde);
  }
  .btn-volver:hover { background: var(--superficie-2); }
  .btn-icono { background: transparent; padding: 8px 10px; }
  .btn-icono i { font-size: 1.25rem; display: block; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-icono.editar { color: var(--morado); }
  .btn-icono.editar:hover { background: var(--morado-claro); }
  .btn-icono.borrar { color: var(--rojo); }
  .btn-icono.borrar:hover { background: rgba(220, 38, 38, .15); }
  .contador {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 24px;
    color: #6458e0;
    font-size: .9rem;
  }
  .filtros {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .fila-filtros {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  @media (max-width: 640px) {
    .fila-filtros { margin-left: 0 !important; }
  }
  .filtros .etiqueta-filtros {
    color: var(--texto-suave);
    font-weight: 300;
    font-size: .9rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-right: 4px;
  }
  .chip {
    border: 1px solid var(--borde);
    background: var(--superficie);
    color: var(--texto-suave);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--morado); color: var(--morado); }
  .chip.activo {
    background: var(--morado);
    border-color: var(--morado);
    color: #fff;
  }
  #lista {
    max-width: 1100px;
    margin: 16px auto 48px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }
  .tarjeta {
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 16px;
    background: var(--superficie);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  html.tema-oscuro .tarjeta { background: #111632; }
  .tarjeta:hover {
    border-color: var(--morado);
    box-shadow: 0 8px 24px rgba(150, 91, 239, .22);
    transform: translateY(-2px);
  }
  /* modo portada */
  #lista.modo-portada { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .tarjeta.portada {
    position: relative;
    padding: 0;
    overflow: hidden;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    border: 1px solid var(--borde);
  }
  .tarjeta.portada img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tarjeta.portada .info {
    position: absolute;
    inset: 0;
    padding: 10px;
    background: linear-gradient(to top, rgba(0, 0, 0, .8), transparent 55%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
  }
  .tarjeta.portada .nombre {
    font-weight: 600;
    font-size: .92rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tarjeta.portada .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tarjeta.portada .nota { font-size: .8rem; background: rgba(255, 255, 255, .18); padding: 1px 7px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; }
  .tarjeta.portada .acciones {
    position: absolute;
    top: 6px;
    right: 6px;
    display: none;
    gap: 2px;
    background: rgba(0, 0, 0, .55);
    border-radius: 8px;
    padding: 2px;
  }
  .tarjeta.portada:hover .acciones { display: flex; }
  .tarjeta.portada .acciones .btn-icono { padding: 5px; color: #fff; }
  .tarjeta.portada .acciones .btn-icono.borrar { color: #fca5a5; }
  .tarjeta .nombre { font-weight: 600; font-size: 1rem; line-height: 1.35; }
  .tarjeta .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tarjeta .dato { color: var(--texto-suave); font-size: .85rem; }
  .tarjeta .nota {
    margin-left: auto;
    background: var(--morado-claro);
    color: var(--morado-oscuro);
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: .85rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tarjeta .nota .estrella { font-size: .9rem; }
  .tarjeta .acciones { display: flex; gap: 4px; justify-content: flex-end; }
  .badge {
    font-size: .78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .badge.Visto { background: var(--morado); color: #fff; }
  .badge.Falta { background: var(--morado-mas-claro); color: var(--morado-oscuro); }
  .badge.Ver { background: var(--morado-claro); color: var(--morado-oscuro); }
  .badge.Urgente { background: #ffb913; color: #22143a; }
  .badge.Viendo { background: #dbeafe; color: #1d4ed8; }
  .badge.clase { background: var(--superficie-suave); color: var(--texto-suave); }
  .badge.clase i { display: inline-block; vertical-align: -1px; }
  .vacio {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--texto-suave);
    padding: 48px 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(31, 41, 55, .85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .overlay.abierto { display: flex; }
  .overlay.animado { opacity: 1; }
  .modal {
    background: var(--superficie);
    border-radius: 16px;
    transform: scale(0.95) translateY(12px);
    opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
  }
  .overlay.animado .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .modal {
    width: 100%;
    max-width: 460px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 18px; color: var(--morado-oscuro); }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: var(--texto); }
  .campo input[type="text"], .campo input[type="number"], .campo select, .campo textarea { width: 100%; }
  .campo-con-boton { display: flex; gap: 8px; }
  .campo-con-boton input { flex: 1; }
  .campo-con-boton .btn-copiar { flex-shrink: 0; }
  .campo input[readonly] {
    background: var(--superficie-suave);
    color: var(--texto-suave);
    cursor: not-allowed;
  }
  .campo textarea { resize: vertical; min-height: 70px; }
  #btnEliminarPoster {
    padding: 6px 12px;
    font-size: .85rem;
    width: fit-content;
  }
  .modal-acciones { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .modal-detalle .titulo { font-size: 1.2rem; font-weight: 700; color: var(--morado-oscuro); margin-bottom: 6px; }
  .modal-detalle .titulo-fila { display: flex; align-items: flex-start; gap: 8px; }
  .modal-detalle .titulo-fila .titulo { flex: 1; margin-bottom: 6px; }
  .btn-copiar {
    background: var(--superficie-suave);
    color: var(--texto-suave);
    padding: 4px 8px;
    font-size: 1rem;
    border-radius: 8px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .btn-copiar:hover { background: var(--borde); color: var(--texto); }
  .btn-copiar i { display: block; }
  .modal-detalle .sub { color: var(--texto-suave); font-size: .9rem; margin-bottom: 18px; }
  #dPoster { display: none; margin-bottom: 14px; }
  #dPoster.tiene-poster { display: block; }
  #dPoster.sin-poster {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100px;
    background: var(--morado-mas-claro);
    border-radius: 10px;
  }
  #dPoster img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 10px;
  }
  .modal-detalle .modal-acciones { justify-content: space-between; }
  .modal-detalle .modal-acciones .btn-secundario {
    background: var(--superficie);
    color: var(--texto-suave);
    border: 1px solid var(--borde);
  }
  .modal-detalle .modal-acciones .btn-secundario:hover { background: var(--superficie-2); }
  .modal-detalle .modal-acciones .btn-secundario i { font-size: 1.1rem; }
  .modal-aleatorio h2 { display: flex; align-items: center; gap: 8px; }
  .modal-aleatorio .alea-busqueda {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    padding: 28px 0;
    color: var(--texto-suave);
    font-size: 1.05rem;
  }
  .modal-aleatorio .alea-busqueda img {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }
  .modal-aleatorio .alea-busqueda i { animation: gira 1s linear infinite; }
  @keyframes gira { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .modal-aleatorio .alea-resultado { display: none; }
  .modal-aleatorio .alea-resultado.visible { display: block; }
  .modal-aleatorio .alea-resultado .alea-titulo {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--morado-oscuro);
    text-align: center;
    margin-bottom: 8px;
  }
  .modal-aleatorio .alea-titulo-fila {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .modal-aleatorio .alea-titulo-fila .alea-titulo { margin-bottom: 0; }
  .modal-aleatorio .alea-img {
    display: block;
    width: 90%;
    max-height: 260px;
    object-fit: contain;
    margin: 0 auto;
  }
  .modal-aleatorio .alea-hora {
    text-align: center;
    color: var(--texto-suave);
    font-size: .95rem;
    margin-bottom: 10px;
  }
  .modal-aleatorio .alea-resultado .alea-meta { display: flex; justify-content: center; gap: 8px; }
  .modal-aleatorio .modal-acciones { justify-content: center; }
  .modal-poster .grid-poster {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .modal-poster .grid-poster img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s, transform .15s;
  }
  .modal-poster .grid-poster img:hover {
    border-color: var(--morado);
    transform: scale(1.03);
  }
  .modal-poster .sin-poster {
    text-align: center;
    color: var(--texto-suave);
    padding: 8px 0;
    font-size: .95rem;
  }
  .btn-buscar-portada {
    background: transparent;
    color: var(--texto-suave);
    border: 1px dashed var(--texto-suave);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: .85rem;
    font-weight: 400;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn-buscar-portada:hover {
    background: var(--morado-claro);
    color: var(--morado-oscuro);
    border-color: var(--morado);
  }
  .detalle-fila { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borde); }
  .detalle-fila:last-of-type { border-bottom: none; }
  .detalle-fila .etiqueta { flex: 0 0 80px; font-size: .85rem; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
  .detalle-fila .valor { flex: 1; font-size: .95rem; word-break: break-word; }
  .estrella { color: #facc15; font-size: 1.05rem; display: inline-block; }
  .tarjeta .meta .estrella { vertical-align: middle; }
  .detalle-fila .valor .estrella { vertical-align: middle; }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--morado-oscuro);
    color: #fff;
    padding: 16px 22px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    opacity: 0;
    transition: transform .25s, opacity .25s;
    z-index: 100;
    width: 90%;
    max-width: 460px;
    text-align: center;
  }
  #toast .ti { margin-right: 8px; font-size: 1.15rem; vertical-align: -2px; }
  #toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
  .cargando { text-align: center; color: var(--texto-suave); padding: 48px 0; grid-column: 1 / -1; }
  #btnSubir {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--morado);
    color: #fff;
    box-shadow: 0 6px 18px rgba(150, 91, 239, .4);
    font-size: 1.5rem;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  #btnSubir:hover { background: var(--morado-oscuro); }
  #btnSubir.visible { display: inline-flex; }
  #btnAleatorio {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--morado);
    color: #fff;
    box-shadow: 0 6px 18px rgba(150, 91, 239, .4);
    font-size: 1.6rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  #btnAleatorio:hover { background: var(--morado-suave); }
</style>
<script>
  // Aplicar el tema antes del primer render para evitar parpadeo
  (function () {
    var oscuro = localStorage.getItem('modoOscuro') === 'true';
    if (oscuro) document.documentElement.classList.add('tema-oscuro');
  })();
</script>
</head>
<body>

        <button type="submit" class="btn-primario" id="btnGuardar"><i class="ti ti-device-floppy"></i> Guardar</button>

</div>

<div class="overlay" id="overlayDetalle">
  <div class="modal modal-detalle">
    <div id="dPoster">
      <button type="button" class="btn-buscar-portada" id="btnBuscarPortada"><i class="ti ti-photo-search"></i> Buscar portada</button>
    </div>
    <div class="titulo-fila">
      <div class="titulo" id="dPelicula"></div>
      <button type="button" class="btn-copiar" id="btnCopiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>

    <div class="detalle-fila"><span class="etiqueta">Nota</span><span class="valor" id="dNota"></span></div>
    <div class="modal-acciones">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarDetalle"><i class="ti ti-arrow-left"></i> Volver</button>
      <button type="button" class="btn-primario" id="btnEditarDesdeDetalle"><i class="ti ti-pencil"></i> Editar</button>

</div>

<div class="overlay" id="overlayAleatorio">

  <div class="modal modal-poster">
    <h2>Elige un póster</h2>

    <div class="modal-acciones">

    </div>

<div id="toast"></div>

<button id="btnAleatorio" title="Película aleatoria"><i class="ti ti-dice-5"></i></button>
<button id="btnSubir" title="Ir al inicio"><i class="ti ti-chevron-up"></i></button>

<script type="module">
  const BASE = 'https://pb.infocatsoluciones.com/api/collections/is_peliculas/records';

  const TMDB_TOKEN = import.meta.env.VITE_API_TMDB || '';

  const $lista = document.getElementById('lista');
  const $buscar = document.getElementById('buscar');
  const $contador = document.getElementById('contador');
  const $filtros = document.getElementById('filtros');
  const $overlay = document.getElementById('overlay');
  const $formulario = document.getElementById('formulario');
  const $modalTitulo = document.getElementById('modalTitulo');
  const $toast = document.getElementById('toast');
  const $btnSubir = document.getElementById('btnSubir');
  const $overlayDetalle = document.getElementById('overlayDetalle');
  const $dPoster = document.getElementById('dPoster');
  const $dPelicula = document.getElementById('dPelicula');
  const $btnCopiar = document.getElementById('btnCopiar');
  const $dVisto = document.getElementById('dVisto');
  const $dDato = document.getElementById('dDato');
  const $dNota = document.getElementById('dNota');
  const $overlayAleatorio = document.getElementById('overlayAleatorio');
  const $aleaBusqueda = document.getElementById('aleaBusqueda');
  const $aleaResultado = document.getElementById('aleaResultado');
  const $btnAleaDetalle = document.getElementById('btnAleaDetalle');
  const $aleaDado = document.getElementById('aleaDado');
  const $overlayPoster = document.getElementById('overlayPoster');
  const $posterGrid = document.getElementById('posterGrid');
  const $carrusel = document.getElementById('carrusel');
  const $carruselWrap = document.getElementById('carruselWrap');

  let peliculas = [];
  let filtro = '';
  let filtroVisto = '';
  let filtroClase = '';
  let modo = 'crear';
  let idEditando = null;
  let detalleActual = null;
  let posterRegistro = null;
  let aleaActual = null;
  let aleaIntervalo = null;
  let aleaCara = 1;
  // modo de vista y carga infinita
  let modoVista = localStorage.getItem('modoVista') === 'titulos' ? 'titulos' : 'portada';
  const LOTE = 20;
  let visiblesMostrados = LOTE;
  let cargandoLote = false;

  function normalizar(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function capitalizar(s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function api(path = '', options = {}) {
    const res = await fetch(BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) {
      let msg = 'Error ' + res.status;
      try {
        const e = await res.json();
        msg = e.message || msg;
      } catch (_) {}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  }

  async function cargar() {
    $carruselWrap.style.display = 'none';
    let page = 1;
    let items = [];
    while (true) {
      const data = await api('?page=' + page + '&perPage=500&sort=-created');
      items = items.concat(data.items);
      if (page >= data.totalPages) break;
      page++;
    }
    peliculas = items;
    render();
    cargarCarrusel();
  }

  async function cargarCarrusel() {
    try {
      const data = await api('?perPage=10&filter=' + encodeURIComponent('(visto="Visto" || visto="Ver otra vez")') + '&sort=-updated');
      $carrusel.innerHTML = '';
      if (!data.items || !data.items.length) {
        $carruselWrap.style.display = 'none';
        return;
      }
      $carruselWrap.style.display = '';
      for (const p of data.items) {
        const div = document.createElement('div');
        div.className = 'carrusel-item';
        const img = document.createElement('img');
        img.src = p.poster ? 'https://image.tmdb.org/t/p/w500/' + p.poster : '/assets/movies.webp';
        img.alt = p.pelicula;
        img.loading = 'lazy';
        div.appendChild(img);
        div.onclick = () => abrirDetalle(p);
        $carrusel.appendChild(div);
      }
      iniciarAutoScroll();
    } catch (_) {
      $carruselWrap.style.display = 'none';
    }
  }

  let carruselTimer = null;
  function tarjetaVisible() {
    return window.innerWidth <= 640 ? 3 : 5;
  }
  function pasoCarrusel() {
    // ancho real de una tarjeta + su gap, para que el destino coincida con el inicio de la siguiente
    const primera = $carrusel.querySelector('.carrusel-item');
    if (!primera) return 1;
    const gap = 10;
    return primera.offsetWidth + gap;
  }
  function moverCarrusel(dir) {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    let destino = Math.min(Math.max($carrusel.scrollLeft + dir * paso, 0), maxScroll);
    $carrusel.scrollTo({ left: destino, behavior: 'smooth' });
    // reinicia el temporizador para que no avance justo después de navegar
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  function autoScroll() {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    const proximo = $carrusel.scrollLeft + paso;
    if (proximo >= maxScroll - 1) {
      $carrusel.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      $carrusel.scrollBy({ left: paso, behavior: 'smooth' });
    }
  }
  function iniciarAutoScroll() {
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  window.addEventListener('resize', () => {
    clearInterval(carruselTimer);
    if ($carruselWrap.style.display !== 'none') iniciarAutoScroll();
  });

  function badge(visto) {
    const cls = visto === 'Visto' ? 'Visto'
      : visto === 'Falta ver' ? 'Falta'
      : visto === 'Ver otra vez' ? 'Ver'
      : visto === 'Viendo' ? 'Viendo'
      : 'Urgente';
    return '<span class="badge ' + cls + '">' + visto + '</span>';
  }

  function badgeClase(clase) {
    const esSerie = (clase || '').toLowerCase() === 'serie';
    const icono = esSerie ? 'ti ti-armchair' : 'ti ti-device-tv';
    const texto = esSerie ? 'Serie' : 'Película';
    return '<span class="badge clase"><i class="' + icono + '"></i> ' + texto + '</span>';
  }

  function tarjeta(p) {
    if (modoVista === 'portada') {
      const div = document.createElement('div');
      div.className = 'tarjeta portada';
      const imgSrc = p.poster
        ? 'https://image.tmdb.org/t/p/w500/' + p.poster
        : '/assets/want.jpg';
      div.innerHTML =
        '<img src="' + imgSrc + '" alt="' + p.pelicula + '" loading="lazy">' +
        '<div class="info">' +
          '<div class="nombre"></div>' +
          '<div class="meta">' +
            (p.nota ? '<span class="nota"><i class="ti ti-star-filled estrella"></i> ' + p.nota + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="acciones">' +
          '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
          '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
        '</div>';
      div.querySelector('.nombre').textContent = capitalizar(p.pelicula);
      div.onclick = () => abrirDetalle(p);
      div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
      div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
      return div;
    }
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML =
      '<div class="nombre"></div>' +
      '<div class="meta">' + badge(p.visto) + badgeClase(p.clase) +
        (p.dato ? '<span class="dato">' + p.dato + '</span>' : '') +
        (p.nota ? '<span class="nota">'  + ' <i class="ti ti-star-filled estrella"></i> ' + p.nota + '</span>' : '') +
      '</div>' +
      '<div class="acciones">' +
        '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
        '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
      '</div>';
    div.querySelector('.nombre').textContent = capitalizar(p.pelicula);
    div.onclick = () => abrirDetalle(p);
    div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
    div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
    return div;
  }

  function render() {
    const q = normalizar(filtro);
    const visibles = peliculas.filter(p => {
      if (filtroVisto && p.visto !== filtroVisto) return false;
      if (filtroClase && (p.clase || 'película') !== filtroClase) return false;
      if (!q) return true;
      return normalizar(p.pelicula).includes(q) || normalizar(p.dato || '').includes(q);
    });
    let texto;
    if (filtroClase === 'película') {
      texto = visibles.length + ' película' + (visibles.length === 1 ? '' : 's');
    } else if (filtroClase === 'serie') {
      texto = visibles.length + ' serie' + (visibles.length === 1 ? '' : 's');
    } else {
      texto = visibles.length + ' películas y series';
    }
    $contador.textContent = texto;
    $lista.classList.toggle('modo-portada', modoVista === 'portada');
    $lista.innerHTML = '';
    if (!peliculas.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Cargando...';
      $lista.appendChild(v);
      return;
    }
    if (!visibles.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Sin resultados para "' + filtro + '"';
      $lista.appendChild(v);
      return;
    }
    if (ordenAZ) {
      visibles.sort((a, b) => a.pelicula.localeCompare(b.pelicula, 'es'));
    }
    const aMostrar = visibles.slice(0, visiblesMostrados);
    for (const p of aMostrar) $lista.appendChild(tarjeta(p));
    if (visibles.length > visiblesMostrados) {
      const c = document.createElement('div');
      c.className = 'cargando';
      c.textContent = 'Cargando más...';
      c.id = 'indicadorCarga';
      $lista.appendChild(c);
    }
  }

  function mostrarToast(msg) {
    $toast.innerHTML = '<i class="ti ti-location-check"></i>' + msg;
    $toast.classList.add('visible');
    clearTimeout(mostrarToast._t);
    mostrarToast._t = setTimeout(() => $toast.classList.remove('visible'), 2500);
  }

  function abrirOverlay($el) {
    $el.style.display = 'flex';
    $el.offsetHeight; // forzar reflow
    $el.classList.add('abierto', 'animado');
  }
  function cerrarOverlay($el) {
    $el.classList.remove('animado');
    setTimeout(() => {
      $el.classList.remove('abierto');
      $el.style.display = '';
    }, 250);
  }

  function abrirModal() { abrirOverlay($overlay); }
  function cerrarModal() { cerrarOverlay($overlay); }

  function abrirDetalle(p) {
    detalleActual = p;
    $dPelicula.textContent = capitalizar(p.pelicula);
    $dVisto.innerHTML = badge(p.visto) + badgeClase(p.clase);
    $dDato.textContent = p.dato ? p.dato : '—';
    $dNota.innerHTML = p.nota
      ? '<i class="ti ti-star-filled estrella"></i> ' + p.nota
      : '—';
    mostrarPoster(p.poster);
    abrirOverlay($overlayDetalle);
  }

  function mostrarPoster(poster) {
    $dPoster.innerHTML = '';
    $dPoster.className = '';
    if (!poster) {
      $dPoster.className = 'sin-poster';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-buscar-portada';
      btn.id = 'btnBuscarPortada';
      btn.innerHTML = '<i class="ti ti-photo-search"></i> Buscar portada';
      btn.onclick = buscarPortadaDesdeDetalle;
      $dPoster.appendChild(btn);
      return;
    }
    $dPoster.className = 'tiene-poster';
    const img = document.createElement('img');
    img.src = 'https://image.tmdb.org/t/p/w500/' + poster;
    img.alt = 'Póster';
    img.onerror = () => { $dPoster.innerHTML = ''; $dPoster.className = ''; };
    $dPoster.appendChild(img);
  }

  function cerrarDetalle() { cerrarOverlay($overlayDetalle); }

  function abrirAleatorio() {
    const candidatas = peliculas.filter(p => p.visto === 'Falta ver' || p.visto === 'Ver otra vez' || p.visto === 'Urgente' || p.visto === 'Viendo');
    aleaActual = null;
    $btnAleaDetalle.style.display = 'none';
    $aleaResultado.classList.remove('visible');
    $aleaResultado.innerHTML = '';
    $aleaBusqueda.style.display = 'flex';
    if (!candidatas.length) {
      $aleaBusqueda.innerHTML = '<i class="ti ti-alert-triangle"></i> No hay películas pendientes';
      abrirOverlay($overlayAleatorio);
      return;
    }
    abrirOverlay($overlayAleatorio);
    // efecto de dados: alterna dice_1 / dice_2 en bucle mientras "sortean"
    clearInterval(aleaIntervalo);
    aleaCara = 1;
    $aleaDado.src = '/assets/dice_1.png';
    aleaIntervalo = setInterval(() => {
      aleaCara = aleaCara === 1 ? 2 : 1;
      $aleaDado.src = '/assets/dice_' + aleaCara + '.png';
    }, 250);
    // efecto de búsqueda por 1 segundo, luego elige al azar
    setTimeout(() => {
      clearInterval(aleaIntervalo);
      aleaIntervalo = null;
      const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
      aleaActual = elegida;
      $aleaBusqueda.style.display = 'none';
      $aleaResultado.innerHTML =
        '<img class="alea-img" src="/assets/movies.webp" alt="Película">' +
        '<div class="alea-hora">Es hora de ver...</div>' +
        '<div class="alea-titulo-fila">' +
          '<div class="alea-titulo">' + capitalizar(elegida.pelicula) + '</div>' +
          '<button type="button" class="btn-copiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>' +
        '</div>' +
        '<div class="alea-meta">' + badge(elegida.visto) + badgeClase(elegida.clase) + '</div>';
      $aleaResultado.querySelector('.btn-copiar').onclick = () => {
        navigator.clipboard.writeText(elegida.pelicula).then(() => {
          mostrarToast('Título copiado');
        }).catch(() => {
          mostrarToast('Error al copiar');
        });
      };
      $aleaResultado.classList.add('visible');
      $btnAleaDetalle.style.display = '';
    }, 1000);
  }

  function cerrarAleatorio() {
    clearInterval(aleaIntervalo);
    aleaIntervalo = null;
    cerrarOverlay($overlayAleatorio);
  }

  function actualizarLabelPelicula() {
    const tipo = $formulario.fClase.value === 'serie' ? 'serie' : 'película';
    document.getElementById('labelPelicula').textContent = 'Título de la ' + tipo;
  }

  function abrirCrear() {
    modo = 'crear';
    idEditando = null;
    $formulario.reset();
    $formulario.fPoster.value = '';
    $formulario.fClase.value = 'película';
    $formulario.fVisto.value = 'Falta ver';
    document.getElementById('btnEliminarPoster').style.display = 'none';
    actualizarLabelPelicula();
    $modalTitulo.textContent = 'Agregar película';
    abrirModal();
    $formulario.fPelicula.focus();
  }

  function abrirEditar(p) {
    modo = 'editar';
    idEditando = p.id;
    $formulario.fId.value = p.id;
    $formulario.fPelicula.value = p.pelicula;
    $formulario.fPoster.value = p.poster || '';
    $formulario.fClase.value = (p.clase || 'película').toLowerCase() === 'serie' ? 'serie' : 'película';
    $formulario.fVisto.value = p.visto;
    $formulario.fDato.value = p.dato || '';
    $formulario.fNota.value = p.nota || '';
    document.getElementById('btnEliminarPoster').style.display = '';
    actualizarLabelPelicula();
    $modalTitulo.textContent = 'Editar película';
    abrirModal();
    $formulario.fPelicula.focus();
  }

  async function buscarPosterTMDb(titulo, esSerie = false) {
    if (!TMDB_TOKEN) throw new Error('Token TMDB no configurado');
    const endpoint = esSerie ? 'search/tv' : 'search/movie';
    const url = 'https://api.themoviedb.org/3/' + endpoint + '?query=' +
      encodeURIComponent(titulo) +
      '&include_adult=false&language=es&page=1';
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        accept: 'application/json',
        Authorization: 'Bearer ' + TMDB_TOKEN
      }
    });
    if (!res.ok) throw new Error('Error TMDB ' + res.status);
    return res.json();
  }

  async function buscarPortadaDesdeDetalle() {
    if (!detalleActual) return;
    try {
      const esSerie = (detalleActual.clase || '').toLowerCase() === 'serie';
      const data = await buscarPosterTMDb(detalleActual.pelicula, esSerie);
      if (!data) return;
      if (data.total_results === 1 && data.results && data.results.length === 1) {
        const poster = data.results[0].poster_path;
        if (poster) {
          await api('/' + detalleActual.id, { method: 'PATCH', body: JSON.stringify({ poster }) });
          detalleActual.poster = poster;
          mostrarToast('Portada actualizada');
          await cargar();
          cerrarOverlay($overlayDetalle);
          setTimeout(() => abrirDetalle(detalleActual), 250);
        }
      } else if (data.results && data.results.length > 1) {
        abrirSelectorPoster(data.results, detalleActual);
      }
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  function abrirSelectorPoster(results, registro) {
    posterRegistro = registro;
    $posterGrid.innerHTML = '';
    const primeros = results.slice(0, 6);
    const conPoster = primeros.filter(r => r.poster_path);
    if (!conPoster.length) {
      const v = document.createElement('div');
      v.className = 'sin-poster';
      v.textContent = 'Sin pósters disponibles';
      $posterGrid.appendChild(v);
    } else {
      for (const r of conPoster) {
        const img = document.createElement('img');
        img.src = 'https://image.tmdb.org/t/p/w500/' + r.poster_path;
        img.alt = r.title || 'Póster';
        img.loading = 'lazy';
        img.onclick = async () => {
          try {
            await api('/' + registro.id, { method: 'PATCH', body: JSON.stringify({ poster: r.poster_path }) });
            registro.poster = r.poster_path;
            mostrarToast('Póster guardado');
            cerrarOverlay($overlayPoster);
            await cargar();
            setTimeout(() => abrirDetalle(registro), 250);
          } catch (err) {
            mostrarToast('Error guardando póster: ' + err.message);
          }
        };
        $posterGrid.appendChild(img);
      }
    }
    abrirOverlay($overlayPoster);
  }

  function cerrarSelectorPoster() { cerrarOverlay($overlayPoster); }

  async function guardar(e) {
    e.preventDefault();
    const body = {
      pelicula: $formulario.fPelicula.value.trim(),
      poster: $formulario.fPoster.value.trim(),
      clase: $formulario.fClase.value,
      visto: $formulario.fVisto.value,
      dato: $formulario.fDato.value.trim(),
      nota: $formulario.fNota.value.trim()
    };
    try {
      let registro;
      if (modo === 'crear') {
        registro = await api('', { method: 'POST', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
        // Auto-buscar portada solo al crear
        if (TMDB_TOKEN) {
          try {
            const esSerie = body.clase === 'serie';
            const data = await buscarPosterTMDb(body.pelicula, esSerie);
            if (data && data.results && data.results.length === 1) {
              const poster = data.results[0].poster_path;
              if (poster) {
                await api('/' + registro.id, { method: 'PATCH', body: JSON.stringify({ poster }) });
                registro.poster = poster;
                mostrarToast('Portada asignada');
              }
            } else if (data && data.results && data.results.length > 1) {
              cerrarModal();
              abrirSelectorPoster(data.results, registro);
              await cargar();
              return;
            }
          } catch (_) {
            // Si TMDB falla, continúa sin asignar portada
          }
        }
      } else {
        registro = await api('/' + idEditando, { method: 'PATCH', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
      }
      await cargar();
      cerrarModal();
      setTimeout(() => {
        if (registro) abrirDetalle(registro);
      }, 250);
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  async function eliminar(id, nombre) {
    if (!confirm('¿Eliminar "' + nombre + '"?')) return;
    try {
      await api('/' + id, { method: 'DELETE' });
      mostrarToast('Eliminado');
      await cargar();
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  const ESTADOS = ['Visto', 'Falta ver', 'Ver otra vez', 'Urgente', 'Viendo'];
  const CLASES = [
    { valor: 'película', etiqueta: 'Película', icono: 'ti ti-device-tv' },
    { valor: 'serie', etiqueta: 'Serie', icono: 'ti ti-armchair' }
  ];
  let ordenAZ = false;

  function resetCargaInfinita() {
    visiblesMostrados = LOTE;
  }

  function construirFiltros() {
    $filtros.innerHTML = '';
    const filaEstado = document.createElement('div');
    filaEstado.className = 'fila-filtros';
    const etiqueta = document.createElement('span');
    etiqueta.className = 'etiqueta-filtros';
    etiqueta.innerHTML = '<i class="ti ti-filter-code"></i> Filtros:';
    filaEstado.appendChild(etiqueta);
    const botones = [{ etiqueta: 'Todos', valor: '' }]
      .concat(ESTADOS.map(v => ({ etiqueta: v, valor: v })));
    for (const b of botones) {
      const btn = document.createElement('button');
      btn.className = 'chip' + (filtroVisto === b.valor ? ' activo' : '');
      btn.textContent = b.etiqueta;
      btn.onclick = () => {
        filtroVisto = filtroVisto === b.valor ? '' : b.valor;
        construirFiltros();
        resetCargaInfinita();
        render();
      };
      filaEstado.appendChild(btn);
    }
    // chip de orden
    const chipOrden = document.createElement('button');
    chipOrden.className = 'chip' + (ordenAZ ? ' activo' : '');
    chipOrden.innerHTML = '<i class="ti ti-sort-a-z"></i> A-Z';
    chipOrden.onclick = () => {
      ordenAZ = !ordenAZ;
      construirFiltros();
      resetCargaInfinita();
      render();
    };
    filaEstado.appendChild(chipOrden);
    $filtros.appendChild(filaEstado);

    const filaClase = document.createElement('div');
    filaClase.className = 'fila-filtros';
    filaClase.style.marginLeft = 'auto';
    const etiquetaClase = document.createElement('span');
    etiquetaClase.className = 'etiqueta-filtros';
    etiquetaClase.innerHTML = '<i class="ti ti-category"></i> Clase:';
    filaClase.appendChild(etiquetaClase);
    for (const c of CLASES) {
      const activo = filtroClase === c.valor;
      const btn = document.createElement('button');
      btn.className = 'chip' + (activo ? ' activo' : '');
      const i = document.createElement('i');
      i.className = c.icono;
      btn.appendChild(i);
      btn.appendChild(document.createTextNode(' ' + c.etiqueta));
      btn.onclick = () => {
        filtroClase = filtroClase === c.valor ? '' : c.valor;
        construirFiltros();
        resetCargaInfinita();
        render();
      };
      filaClase.appendChild(btn);
    }
    $filtros.appendChild(filaClase);
  }

  let debounceTimer = null;
  $buscar.addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filtro = e.target.value.trim();
      resetCargaInfinita();
      render();
    }, 300);
  });

  $buscar.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    clearTimeout(debounceTimer);
    filtro = e.target.value.trim();
    resetCargaInfinita();
    render();
  });

  window.addEventListener('scroll', () => {
    $btnSubir.classList.toggle('visible', window.scrollY > 300);
    // carga infinita: cuando se acerca al final, muestra otros 20
    if (cargandoLote) return;
    const final = document.documentElement.scrollHeight - window.innerHeight;
    if (window.scrollY >= final - 600) {
      const total = document.querySelectorAll('#lista .tarjeta').length;
      if (total >= visiblesMostrados) {
        cargandoLote = true;
        visiblesMostrados += LOTE;
        render();
        cargandoLote = false;
      }
    }
  }, { passive: true });
  $btnSubir.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('btnAgregar').onclick = abrirCrear;
  document.getElementById('btnLimpiar').onclick = () => {
    $buscar.value = '';
    clearTimeout(debounceTimer);
    filtro = '';
    resetCargaInfinita();
    render();
    $buscar.focus();
  };
  document.getElementById('btnAleatorio').onclick = abrirAleatorio;
  document.getElementById('carruselPrev').onclick = () => moverCarrusel(-1);
  document.getElementById('carruselNext').onclick = () => moverCarrusel(1);
  $overlayAleatorio.addEventListener('click', e => { if (e.target === $overlayAleatorio) cerrarAleatorio(); });
  document.getElementById('btnAleaDetalle').onclick = () => {
    cerrarAleatorio();
    setTimeout(() => {
      if (aleaActual) abrirDetalle(aleaActual);
    }, 250);
  };
  document.getElementById('btnCancelar').onclick = cerrarModal;
  document.getElementById('btnEliminarPoster').onclick = () => {
    $formulario.fPoster.value = '';
    mostrarToast('Poster eliminado');
  };
  $formulario.fClase.addEventListener('change', actualizarLabelPelicula);
  $overlay.addEventListener('click', e => { if (e.target === $overlay) cerrarModal(); });
  $overlayDetalle.addEventListener('click', e => { if (e.target === $overlayDetalle) cerrarDetalle(); });
  document.getElementById('btnCerrarDetalle').onclick = cerrarDetalle;
  document.getElementById('btnCerrarPoster').onclick = cerrarSelectorPoster;
  $overlayPoster.addEventListener('click', e => { if (e.target === $overlayPoster) cerrarSelectorPoster(); });
  document.getElementById('btnCopiarPelicula').onclick = () => {
    const texto = $formulario.fPelicula.value;
    if (!texto) return;
    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  $btnCopiar.onclick = () => {
    if (!detalleActual) return;
    navigator.clipboard.writeText(detalleActual.pelicula).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  document.getElementById('btnEditarDesdeDetalle').onclick = () => {
    cerrarDetalle();
    setTimeout(() => {
      if (detalleActual) abrirEditar(detalleActual);
    }, 250);
  };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    cerrarDetalle();
    cerrarModal();
    cerrarSelectorPoster();
    cerrarAleatorio();
  });
  $formulario.addEventListener('submit', guardar);

  construirFiltros();

  cargar().catch(err => {
    $lista.innerHTML = '';
    const v = document.createElement('div');
    v.className = 'vacio';
    v.textContent = 'No se pudo cargar: ' + err.message;
    $lista.appendChild(v);
  });
</script>

</body>
</html>
