<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoteca</title>
  <link rel="icon" type="image/png" href="/assets/martian.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
	<link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
<script>
  // Aplicar el tema antes del primer render para evitar parpadeo
  (function () {
    var oscuro = localStorage.getItem('modoOscuro') !== 'false';
    if (oscuro) document.documentElement.classList.add('tema-oscuro');
  })();
</script>
<script>
  // Bloquear el menú contextual (clic derecho) en toda la página
  document.addEventListener('contextmenu', e => e.preventDefault(), true);
  // Evitar arrastrar imágenes fuera de la página
  document.addEventListener('dragstart', e => {
    if (e.target.closest('img')) e.preventDefault();
  }, true);
  // Marcar todas las imágenes (incluidas las dinámicas) como no arrastrables
  const marcarImagenes = () => document.querySelectorAll('img').forEach(img => { img.draggable = false; });
  marcarImagenes();
  new MutationObserver(marcarImagenes).observe(document.documentElement, { childList: true, subtree: true });
</script>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <img class="logo" src="/assets/martian.png" alt="Videoteca">
    <h1>Videoteca</h1>
  </div>
  <div style="display:flex; align-items:center; gap:6px;">
    <div class="menu-wrap">
      <button type="button" class="btn-menu" id="btnMenu" title="Menú"><i class="ti ti-menu-2"></i></button>
      <nav class="menu-panel" id="menuPanel">
        <a href="/index.html" class="activo"><i class="ti ti-device-tv"></i> Películas / Series</a>
        <a href="/juegos.html"><i class="ti ti-device-gamepad"></i> Juegos</a>
        <a href="/reportes.html"><i class="ti ti-chart-bar"></i> Reportes</a>
        <a href="/config.html"><i class="ti ti-settings"></i> Configuración</a>
      </nav>
    </div>
  </div>
</header>

<div class="carrusel-wrap" id="carruselWrap">
  <div class="carrusel-titulo"><i class="ti ti-swipe"></i> Visto últimamente</div>
  <button class="carrusel-btn prev" id="carruselPrev" title="Anterior"><i class="ti ti-chevron-left"></i></button>
  <div class="carrusel" id="carrusel"></div>
  <button class="carrusel-btn next" id="carruselNext" title="Siguiente"><i class="ti ti-chevron-right"></i></button>
</div>

<div class="toolbar">
  <div class="buscar-wrap">
    <input type="text" id="buscar" placeholder="Buscar por película o dato...">
    <button class="btn-limpiar" id="btnLimpiar" title="Limpiar búsqueda"><i class="ti ti-eraser"></i></button>
  </div>
  <button class="btn-primario" id="btnAgregar"><i class="ti ti-plus"></i> Agregar</button>
</div>
<div class="filtros" id="filtros"></div>
<div class="contador" id="contador"></div>
<div id="lista"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitulo">Agregar película</h2>
    <form id="formulario">
      <input type="hidden" id="fId">
      <div class="campo">
        <label for="fClase"><i class="ti ti-category"></i> Clase</label>
        <select id="fClase">
          <option value="película">Película</option>
          <option value="serie">Serie</option>
        </select>
      </div>
      <div class="campo">
        <label for="fPelicula"><i class="ti ti-movie"></i> <span id="labelPelicula">Título de la película</span></label>
        <div class="campo-con-boton">
          <input type="text" id="fPelicula" required>
          <button type="button" class="btn-copiar" id="btnCopiarPelicula" title="Copiar título"><i class="ti ti-clipboard"></i></button>
        </div>
      </div>
      <div class="campo">
        <label for="fPlataforma"><i class="ti ti-device-tv"></i> Plataforma</label>
        <select id="fPlataforma">
          <option value="">Sin plataforma</option>
        </select>
      </div>
      <div class="campo">
        <label for="fEtiquetas"><i class="ti ti-tags"></i> Etiquetas</label>
        <div id="etiquetasBotones" class="etiquetas-botones"></div>
        <input type="hidden" id="fEtiquetas">
        <div class="buscar-wrap">
          <input type="text" id="buscarEtiqueta" placeholder="Buscar o agregar otra etiqueta...">
          <button class="btn-limpiar" id="btnLimpiarEtiqueta" title="Limpiar búsqueda"><i class="ti ti-eraser"></i></button>
        </div>
        <div id="etiquetasResultados" class="etiquetas-resultados"></div>
      </div>
      <div class="campo">
        <input type="hidden" id="fPoster">
        <button type="button" class="btn-secundario" id="btnEliminarPoster"><i class="ti ti-trash"></i> Eliminar poster</button>
      </div>
      <div class="campo">
        <label for="fDato"><i class="ti ti-info-circle"></i> Información adicional</label>
        <input type="text" id="fDato">
      </div>
      <div class="campo">
        <label for="fVisto"><i class="ti ti-eye"></i> Visto</label>
        <select id="fVisto">
          <option>Visto</option>
          <option>Falta ver</option>
          <option>Ver otra vez</option>
          <option>Urgente</option>
          <option>Viendo</option>
        </select>
      </div>
      <div class="campo">
        <label for="fNota"><i class="ti ti-star"></i> Calificación</label>
        <input type="number" id="fNota" min="0" max="5" step="0.1">
      </div>
      <div class="campo">
        <label for="fAnio"><i class="ti ti-calendar"></i> Año</label>
        <input type="number" id="fAnio" min="1888" max="2100" step="1">
      </div>
      <div class="campo">
        <label for="fRecomendable"><i class="ti ti-thumb-up"></i> Recomendable</label>
        <div class="switch">
          <input type="checkbox" id="fRecomendable">
          <span class="pista"></span>
          <span class="perilla"></span>
        </div>
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn-secundario btn-volver" id="btnCancelar"><i class="ti ti-arrow-left"></i> Volver</button>
        <button type="submit" class="btn-primario" id="btnGuardar"><i class="ti ti-device-floppy"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="overlayDetalle">
  <div class="modal modal-detalle">
    <div id="dPoster">
      <button type="button" class="btn-buscar-portada" id="btnBuscarPortada"><i class="ti ti-photo-search"></i> Buscar portada</button>
    </div>
    <div class="titulo-centrado">
      <div class="titulo" id="dPelicula"></div>
      <button type="button" class="btn-copiar" id="btnCopiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>
    </div>
    <div class="estado-centrado" id="dVisto"></div>
    <div class="etiquetas-detalle" id="dEtiquetasDetalle"></div>
    <div class="detalle-fila"><span class="etiqueta">Información</span><span class="valor" id="dDato"></span></div>
    <div class="detalle-fila"><span class="etiqueta">Calificación</span><span class="valor" id="dNota"></span></div>
    <div class="detalle-fila" id="dPlataformaFila" style="display:none"><span class="valor" id="dPlataforma"></span></div>
    <div class="recomendada-centrado" id="dRecomendableFila" style="display:none"><span class="btn-recomendar on"><i class="ti ti-thumb-up"></i> Recomendada</span></div>
    <div class="modal-acciones">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarDetalle"><i class="ti ti-arrow-left"></i> Volver</button>
      <button type="button" class="btn-primario" id="btnEditarDesdeDetalle"><i class="ti ti-pencil"></i> Editar</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayAleatorio">
  <div class="modal modal-aleatorio">
    <h2><i class="ti ti-dice-5"></i> Película aleatoria</h2>
    <div class="alea-busqueda" id="aleaBusqueda">
      <img id="aleaDado" src="/assets/dice_1.png" alt="Dado">
      <span><i class="ti ti-player-track-next"></i> Buscando...</span>
    </div>
    <div class="alea-resultado" id="aleaResultado"></div>
    <div class="modal-acciones">
      <button type="button" class="btn-primario" id="btnAleaDetalle" style="display:none"><i class="ti ti-eye"></i> Ver detalles</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayPoster">
  <div class="modal modal-poster">
    <h2>Elige un póster</h2>
    <div id="posterGrid" class="grid-poster"></div>
    <div class="modal-acciones">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarPoster"><i class="ti ti-arrow-left"></i> Volver</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<button id="btnAleatorio" title="Película aleatoria"><i class="ti ti-dice-5"></i></button>
<button id="btnSubir" title="Ir al inicio"><i class="ti ti-chevron-up"></i></button>

<script type="module">
  const BASE = 'https://pb.infocatsoluciones.com/api/collections/is_peliculas/records';
  const BASE_PLATAFORMAS = 'https://pb.infocatsoluciones.com/api/collections/is_plataformas/records';
  const BASE_ETIQUETAS = 'https://pb.infocatsoluciones.com/api/collections/is_etiquetas/records';

  const TMDB_TOKEN = import.meta.env.VITE_API_TMDB || '';

  const $lista = document.getElementById('lista');
  const $buscar = document.getElementById('buscar');
  const $contador = document.getElementById('contador');
  const $filtros = document.getElementById('filtros');
  const $overlay = document.getElementById('overlay');
  const $formulario = document.getElementById('formulario');
  const $modalTitulo = document.getElementById('modalTitulo');
  const $toast = document.getElementById('toast');
  const $btnSubir = document.getElementById('btnSubir');
  const $overlayDetalle = document.getElementById('overlayDetalle');
  const $dPoster = document.getElementById('dPoster');
  const $dPelicula = document.getElementById('dPelicula');
  const $btnCopiar = document.getElementById('btnCopiar');
  const $dVisto = document.getElementById('dVisto');
  const $dDato = document.getElementById('dDato');
  const $dPlataformaFila = document.getElementById('dPlataformaFila');
  const $dPlataforma = document.getElementById('dPlataforma');
  const $dEtiquetasDetalle = document.getElementById('dEtiquetasDetalle');
  const $dNota = document.getElementById('dNota');
  const $dRecomendableFila = document.getElementById('dRecomendableFila');
  const $overlayAleatorio = document.getElementById('overlayAleatorio');
  const $aleaBusqueda = document.getElementById('aleaBusqueda');
  const $aleaResultado = document.getElementById('aleaResultado');
  const $btnAleaDetalle = document.getElementById('btnAleaDetalle');
  const $aleaDado = document.getElementById('aleaDado');
  const $overlayPoster = document.getElementById('overlayPoster');
  const $posterGrid = document.getElementById('posterGrid');
  const $carrusel = document.getElementById('carrusel');
  const $carruselWrap = document.getElementById('carruselWrap');
  const $etiquetasBotones = document.getElementById('etiquetasBotones');
  const $buscarEtiqueta = document.getElementById('buscarEtiqueta');
  const $etiquetasResultados = document.getElementById('etiquetasResultados');

  let peliculas = [];
  let plataformas = [];
  let etiquetas = [];
  let etiquetasSeleccionadas = [];
  let filtro = '';
  let filtroVisto = '';
  let filtroClase = '';
  let filtroRecomendado = '';
  let modo = 'crear';
  let idEditando = null;
  let detalleActual = null;
  let posterRegistro = null;
  let aleaActual = null;
  let aleaIntervalo = null;
  let aleaCara = 1;
  // modo de vista y carga infinita
  let modoVista = localStorage.getItem('modoVista') === 'titulos' ? 'titulos' : 'portada';
  const LOTE = 20;
  let visiblesMostrados = LOTE;
  let cargandoLote = false;

  function normalizar(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function capitalizar(s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function iconoNota(nota) {
    const n = Number(nota);
    if (n >= 4) return 'ti ti-star-filled llena';
    if (n >= 3) return 'ti ti-star';
    return 'ti ti-star-half';
  }

  function dadoSrc(cara) {
    const oscuro = document.documentElement.classList.contains('tema-oscuro');
    return oscuro ? '/assets/dice_' + cara + '_blanco.png' : '/assets/dice_' + cara + '.png';
  }

  function nombrePlataforma(p) {
    return p.plataforma.split(' ').map(capitalizar).join(' ');
  }

  async function cargarPlataformas() {
    const res = await fetch(BASE_PLATAFORMAS + '?perPage=200');
    if (!res.ok) throw new Error('Error cargando plataformas ' + res.status);
    const data = await res.json();
    plataformas = data.items || [];
    const $sel = document.getElementById('fPlataforma');
    $sel.innerHTML = '<option value="">Sin plataforma</option>';
    for (const p of plataformas) {
      const op = document.createElement('option');
      op.value = p.id;
      op.textContent = nombrePlataforma(p);
      $sel.appendChild(op);
    }
  }

  const ETIQUETAS_INICIALES = [
    { id: 'r155db6d7ee3325', etiqueta: 'Acción' },
    { id: 'rce032e27c05934', etiqueta: 'Comedia' },
    { id: 'r269e514b3dbd97', etiqueta: 'Drama' },
    { id: 'r31957a1bdecd8a', etiqueta: 'Romance' },
    { id: 'r71d39f65338ae0', etiqueta: 'Suspenso' },
    { id: 'raa6f9b3c520f73', etiqueta: 'Terror' },
    { id: 'r5fc85d37ea4dbe', etiqueta: 'Ciencia ficción' },
    { id: 'r42d42a784208a3', etiqueta: 'Fantasía' },
    { id: 'r61730636663d7f', etiqueta: 'Documental' },
    { id: 'rbc311f12c2ea17', etiqueta: 'Animación' },
    { id: 'r299a6f8a3ce219', etiqueta: 'Aventura' },
    { id: 'rbae84157ae17a8', etiqueta: 'Clásico' },
    { id: 're61a29abceac78', etiqueta: 'Estreno' },
    { id: 'r1f91502e3a16fc', etiqueta: 'Oscar' },
    { id: 'rcbab36bd777a2d', etiqueta: 'Familiar' }
  ];

  async function cargarEtiquetas() {
    // Solo construye los botones base (las 15 iniciales); el resto se busca por URL al editar
    etiquetas = ETIQUETAS_INICIALES;
    renderEtiquetasBotones();
  }

  function renderEtiquetasBotones() {
    $etiquetasBotones.innerHTML = '';
    // las seleccionadas que no estén en la lista base se agregan al final para poder desactivarlas
    const extras = etiquetasSeleccionadas
      .map(id => etiquetas.find(e => e.id === id))
      .filter(Boolean);
    const todas = ETIQUETAS_INICIALES.concat(
      extras.filter(e => !ETIQUETAS_INICIALES.some(x => x.id === e.id))
    );
    for (const e of todas) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'etiqueta-btn' + (etiquetasSeleccionadas.includes(e.id) ? ' activa' : '');
      btn.textContent = e.etiqueta;
      btn.onclick = () => {
        const idx = etiquetasSeleccionadas.indexOf(e.id);
        if (idx >= 0) {
          etiquetasSeleccionadas.splice(idx, 1);
        } else {
          etiquetasSeleccionadas.push(e.id);
        }
        $formulario.fEtiquetas.value = etiquetasSeleccionadas.join(',');
        renderEtiquetasBotones();
        renderEtiquetasResultados();
      };
      $etiquetasBotones.appendChild(btn);
    }
  }

  async function renderEtiquetasResultados() {
    const q = normalizar($buscarEtiqueta.value.trim());
    $etiquetasResultados.innerHTML = '';
    if (!q) return;
    try {
      // busca en el backend las etiquetas que coinciden con el término
      const filtro = 'etiqueta ~ "' + q.replace(/"/g, '') + '"';
      const res = await fetch(BASE_ETIQUETAS + '?perPage=8&sort=etiqueta&filter=' + encodeURIComponent(filtro));
      if (!res.ok) return;
      const data = await res.json();
      const candidatas = (data.items || []).filter(e => !etiquetasSeleccionadas.includes(e.id));
      for (const e of candidatas.slice(0, 6)) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = e.etiqueta;
        btn.onclick = () => {
          etiquetasSeleccionadas.push(e.id);
          if (!etiquetas.some(x => x.id === e.id)) etiquetas.push(e);
          $formulario.fEtiquetas.value = etiquetasSeleccionadas.join(',');
          $buscarEtiqueta.value = '';
          $etiquetasResultados.innerHTML = '';
          renderEtiquetasBotones();
        };
        $etiquetasResultados.appendChild(btn);
      }
    } catch (_) {}
  }

  function buscarEtiquetaDebounce() {
    clearTimeout(buscarEtiquetaDebounce._t);
    buscarEtiquetaDebounce._t = setTimeout(renderEtiquetasResultados, 300);
  }

  async function api(path = '', options = {}) {
    const res = await fetch(BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) {
      let msg = 'Error ' + res.status;
      try {
        const e = await res.json();
        msg = e.message || msg;
      } catch (_) {}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  }

  async function cargar() {
    $carruselWrap.style.display = 'none';
    let page = 1;
    let items = [];
    while (true) {
      const data = await api('?page=' + page + '&perPage=500&sort=-created&expand=etiquetas&filter=' + encodeURIComponent('(clase != "juego" && clase != "libro")'));
      items = items.concat(data.items);
      if (page >= data.totalPages) break;
      page++;
    }
    peliculas = items;
    render();
    cargarCarrusel();
  }

  async function cargarCarrusel() {
    try {
      const data = await api('?perPage=10&expand=etiquetas&filter=' + encodeURIComponent('(visto="Visto" || visto="Ver otra vez") && (clase != "juego" && clase != "libro")') + '&sort=-updated');
      $carrusel.innerHTML = '';
      if (!data.items || !data.items.length) {
        $carruselWrap.style.display = 'none';
        return;
      }
			
      $carruselWrap.style.display = '';
      for (const p of data.items) {
        const div = document.createElement('div');
        div.className = 'carrusel-item';
        const img = document.createElement('img');
        img.src = p.poster ? 'https://image.tmdb.org/t/p/w500/' + p.poster : '/assets/want.jpg';
        img.alt = p.pelicula;
        img.loading = 'lazy';
        div.appendChild(img);
        div.onclick = () => abrirDetalle(p);
        $carrusel.appendChild(div);
      }
      iniciarAutoScroll();
    } catch (_) {
      $carruselWrap.style.display = 'none';
    }
  }

  let carruselTimer = null;
  function tarjetaVisible() {
    return window.innerWidth <= 640 ? 3 : 5;
  }
  function pasoCarrusel() {
    // ancho real de una tarjeta + su gap, para que el destino coincida con el inicio de la siguiente
    const primera = $carrusel.querySelector('.carrusel-item');
    if (!primera) return 1;
    const gap = 10;
    return primera.offsetWidth + gap;
  }
  function moverCarrusel(dir) {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    let destino = Math.min(Math.max($carrusel.scrollLeft + dir * paso, 0), maxScroll);
    $carrusel.scrollTo({ left: destino, behavior: 'smooth' });
    // reinicia el temporizador para que no avance justo después de navegar
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  function autoScroll() {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    const proximo = $carrusel.scrollLeft + paso;
    if (proximo >= maxScroll - 1) {
      $carrusel.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      $carrusel.scrollBy({ left: paso, behavior: 'smooth' });
    }
  }
  function iniciarAutoScroll() {
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  window.addEventListener('resize', () => {
    clearInterval(carruselTimer);
    if ($carruselWrap.style.display !== 'none') iniciarAutoScroll();
  });

  function badge(visto) {
    const cls = visto === 'Visto' ? 'Visto'
      : visto === 'Falta ver' ? 'Falta'
      : visto === 'Ver otra vez' ? 'Ver'
      : visto === 'Viendo' ? 'Viendo'
      : 'Urgente';
    let icono = '';
    if (visto === 'Falta ver') icono = '<i class="ti ti-circle-plus-2"></i> ';
    else if (visto === 'Visto' || visto === 'Ver otra vez' || visto === 'Viendo') icono = '<i class="ti ti-checks"></i> ';
    return '<span class="badge ' + cls + '">' + icono + visto + '</span>';
  }

  function badgeClase(clase) {
    const esSerie = (clase || '').toLowerCase() === 'serie';
    const icono = esSerie ? 'ti ti-armchair' : 'ti ti-device-tv';
    const texto = esSerie ? 'Serie' : 'Película';
    return '<span class="badge clase"><i class="' + icono + '"></i> ' + texto + '</span>';
  }

  function tituloConAnio(p) {
    const base = capitalizar(p.pelicula);
    return p.anio ? base + ' (' + p.anio + ')' : base;
  }

  function tarjeta(p) {
    if (modoVista === 'portada') {
      const div = document.createElement('div');
      div.className = 'tarjeta portada';
      const imgSrc = p.poster
        ? 'https://image.tmdb.org/t/p/w500/' + p.poster
        : '/assets/want.jpg';
      div.innerHTML =
        '<img src="' + imgSrc + '" alt="' + p.pelicula + '" loading="lazy">' +
        (p.visto === 'Viendo' ? '<span class="cinta-viendo">Viendo</span>' : '') +
        '<div class="info">' +
          '<div class="nombre"></div>' +
          '<div class="meta">' +
            (p.nota ? '<span class="nota"><i class="' + iconoNota(p.nota) + ' estrella"></i> ' + p.nota + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="acciones">' +
          '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
          '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
        '</div>';
      div.querySelector('.nombre').textContent = capitalizar(p.pelicula);
      div.onclick = () => abrirDetalle(p);
      div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
      div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
      return div;
    }
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML =
      '<div class="nombre"></div>' +
      '<div class="meta">' + badge(p.visto) + badgeClase(p.clase) +
        (p.dato ? '<span class="dato">' + p.dato + '</span>' : '') +
        (p.nota ? '<span class="nota">'  + ' <i class="' + iconoNota(p.nota) + ' estrella"></i> ' + p.nota + '</span>' : '') +
      '</div>' +
      '<div class="acciones">' +
        '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
        '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
      '</div>';
    div.querySelector('.nombre').textContent = tituloConAnio(p);
    div.onclick = () => abrirDetalle(p);
    div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
    div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
    return div;
  }

  function render() {
    const q = normalizar(filtro);
    // Construir lista de visibles con info de match por etiqueta
    const visiblesInfo = [];
    let porEtiqueta = 0;
    for (const p of peliculas) {
      if (filtroVisto && p.visto !== filtroVisto) continue;
      if (filtroClase && (p.clase || 'película') !== filtroClase) continue;
      if (filtroRecomendado === 'si' && !p.recomendable) continue;
      if (!q) { visiblesInfo.push({ p, tagMatch: null }); continue; }
      // buscar en título y dato
      if (normalizar(p.pelicula).includes(q) || normalizar(p.dato || '').includes(q)) {
        visiblesInfo.push({ p, tagMatch: null });
        continue;
      }
      // buscar en etiquetas expandidas
      const etiquetasExpandidas = (p.expand && Array.isArray(p.expand.etiquetas)) ? p.expand.etiquetas : [];
      let foundTag = null;
      for (const e of etiquetasExpandidas) {
        if (normalizar(e.etiqueta || '').includes(q)) { foundTag = e.etiqueta; break; }
      }
      if (foundTag) {
        visiblesInfo.push({ p, tagMatch: foundTag });
        porEtiqueta++;
      }
    }
    const visibles = visiblesInfo.map(v => v.p);
    let texto;
    if (filtroClase === 'película') {
      texto = visibles.length + ' película' + (visibles.length === 1 ? '' : 's');
    } else if (filtroClase === 'serie') {
      texto = visibles.length + ' serie' + (visibles.length === 1 ? '' : 's');
    } else {
      texto = visibles.length + ' películas y series';
    }
    if (q && porEtiqueta > 0) {
      texto += ' (' + porEtiqueta + ' por etiqueta)';
    }
    $contador.textContent = texto;
    $lista.classList.toggle('modo-portada', modoVista === 'portada');
    $lista.innerHTML = '';
    if (!peliculas.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Cargando...';
      $lista.appendChild(v);
      return;
    }
    if (!visibles.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Sin resultados para "' + filtro + '"';
      $lista.appendChild(v);
      return;
    }
    if (ordenAZ) {
      visiblesInfo.sort((a, b) => a.p.pelicula.localeCompare(b.p.pelicula, 'es') * (ordenAZ === 2 ? -1 : 1));
    }
    const aMostrar = visiblesInfo.slice(0, visiblesMostrados);
    for (const vi of aMostrar) $lista.appendChild(tarjeta(vi.p));
    if (visibles.length > visiblesMostrados) {
      const c = document.createElement('div');
      c.className = 'cargando';
      c.textContent = 'Cargando más...';
      c.id = 'indicadorCarga';
      $lista.appendChild(c);
    }
  }

  function mostrarToast(msg) {

  function abrirOverlay($el) {
    $el.style.display = 'flex';
    $el.offsetHeight; // forzar reflow
    $el.classList.add('abierto', 'animado');

  function cerrarOverlay($el) {
    $el.classList.remove('animado');
    setTimeout(() => {
      $el.classList.remove('abierto');
      $el.style.display = '';
    }, 250);
  }

  function abrirDetalle(p) {
    detalleActual = p;
    $dPelicula.textContent = tituloConAnio(p);
    $dVisto.innerHTML = badgeClase(p.clase) + badge(p.visto);
    $dDato.textContent = p.dato ? p.dato : '—';
    const plat = plataformas.find(x => String(x.id) === String(p.plataforma));
    if (plat && plat.logo) {
      $dPlataforma.innerHTML = '<span class="plataforma-tooltip-wrap"><span class="plataforma-tooltip">' + nombrePlataforma(plat) + '</span><img class="logo-plataforma" src="/logos/' + plat.logo + '" alt="' + nombrePlataforma(plat) + '"></span>';
      $dPlataformaFila.style.display = '';
    } else {
      $dPlataforma.innerHTML = '';
      $dPlataformaFila.style.display = 'none';
    }
    $dNota.innerHTML = p.nota
      ? '<i class="' + iconoNota(p.nota) + ' estrella"></i> ' + p.nota
      : '—';
    const idsEtiquetas = Array.isArray(p.etiquetas) ? p.etiquetas : (p.etiquetas || '').split(',').filter(Boolean);
    if (idsEtiquetas.length) {
      // usa el expand del backend si está disponible, sino el catálogo local (15 iniciales + agregadas)
      const expandidas = (p.expand && Array.isArray(p.expand.etiquetas)) ? p.expand.etiquetas : [];
      const nombres = idsEtiquetas.map(id => {
        const ex = expandidas.find(x => x.id === id);
        if (ex) return ex.etiqueta;
        const e = etiquetas.find(x => x.id === id);
        return e ? e.etiqueta : id;
      });
      $dEtiquetasDetalle.innerHTML = nombres.map(n => '<span>' + n + '</span>').join('<span class="separador"> · </span>');
      $dEtiquetasDetalle.style.display = '';
    } else {
      $dEtiquetasDetalle.textContent = '';
      $dEtiquetasDetalle.style.display = 'none';
    }
    $dRecomendableFila.style.display = p.recomendable ? '' : 'none';
    mostrarPoster(p.poster);
    abrirOverlay($overlayDetalle);
  }

  function mostrarPoster(poster) {
    $dPoster.innerHTML = '';
    $dPoster.className = '';

      $dPoster.className = 'sin-poster';

  function abrirAleatorio() {
    const candidatas = peliculas.filter(p => p.visto === 'Falta ver' || p.visto === 'Ver otra vez' || p.visto === 'Urgente' || p.visto === 'Viendo');
    aleaActual = null;
    $btnAleaDetalle.style.display = 'none';
    $aleaResultado.classList.remove('visible');
    $aleaResultado.innerHTML = '';
    $aleaBusqueda.style.display = 'flex';
    if (!candidatas.length) {
      $aleaBusqueda.innerHTML = '<i class="ti ti-alert-triangle"></i> No hay películas pendientes';
      abrirOverlay($overlayAleatorio);
      return;
    }
    abrirOverlay($overlayAleatorio);
    // efecto de dados: alterna dice_1 / dice_2 en bucle mientras "sortean"
    clearInterval(aleaIntervalo);
    aleaCara = 1;
    $aleaDado.src = dadoSrc(1);
    aleaIntervalo = setInterval(() => {
      aleaCara = aleaCara === 1 ? 2 : 1;
      $aleaDado.src = dadoSrc(aleaCara);
    }, 250);
    // efecto de búsqueda por 1 segundo, luego elige al azar
    setTimeout(() => {
      clearInterval(aleaIntervalo);
      aleaIntervalo = null;
      const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
      aleaActual = elegida;
      $aleaBusqueda.style.display = 'none';
      $aleaResultado.innerHTML =
        '<img class="alea-img" src="' + (elegida.poster ? 'https://image.tmdb.org/t/p/w500/' + elegida.poster : '/assets/want.jpg') + '" alt="Película">' +
        '<div class="alea-hora">Es hora de ver...</div>' +
        '<div class="alea-titulo-fila">' +
          '<div class="alea-titulo">' + tituloConAnio(elegida) + '</div>' +
          '<button type="button" class="btn-copiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>' +
        '</div>' +
        '<div class="alea-meta">' + badge(elegida.visto) + badgeClase(elegida.clase) + '</div>';
      $aleaResultado.querySelector('.btn-copiar').onclick = () => {
        navigator.clipboard.writeText(elegida.pelicula).then(() => {
          mostrarToast('Título copiado');
        }).catch(() => {
          mostrarToast('Error al copiar');
        });
      };
      $aleaResultado.classList.add('visible');
      $btnAleaDetalle.style.display = '';
    }, 1000);
  }

  function cerrarAleatorio() {
    clearInterval(aleaIntervalo);
    aleaIntervalo = null;
    cerrarOverlay($overlayAleatorio);
  }

  async function buscarPosterTMDb(titulo, esSerie = false) {
    if (!TMDB_TOKEN) throw new Error('Token TMDB no configurado');
    const endpoint = esSerie ? 'search/tv' : 'search/movie';
    const url = 'https://api.themoviedb.org/3/' + endpoint + '?query=' +
      encodeURIComponent(titulo) +
      '&include_adult=false&language=es&page=1';
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        accept: 'application/json',
        Authorization: 'Bearer ' + TMDB_TOKEN
      }
    });
    if (!res.ok) throw new Error('Error TMDB ' + res.status);
    return res.json();
  }

  async function buscarPortadaDesdeDetalle() {
    if (!detalleActual) return;
    try {
      const esSerie = (detalleActual.clase || '').toLowerCase() === 'serie';
      const data = await buscarPosterTMDb(detalleActual.pelicula, esSerie);
      if (!data) return;
      if (data.total_results === 1 && data.results && data.results.length === 1) {
        const poster = data.results[0].poster_path;
        if (poster) {
          await api('/' + detalleActual.id, { method: 'PATCH', body: JSON.stringify({ poster }) });
          detalleActual.poster = poster;
          mostrarToast('Portada actualizada');
          await cargar();
          cerrarOverlay($overlayDetalle);
          setTimeout(() => abrirDetalle(detalleActual), 250);
        }
      } else if (data.results && data.results.length > 1) {
        abrirSelectorPoster(data.results, detalleActual);
      }
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  function abrirSelectorPoster(results, registro) {
    posterRegistro = registro;
    $posterGrid.innerHTML = '';
    const primeros = results.slice(0, 12);
    const conPoster = primeros.filter(r => r.poster_path);
    if (!conPoster.length) {
      const v = document.createElement('div');
      v.className = 'sin-poster';
      v.textContent = 'Sin pósters disponibles';
      $posterGrid.appendChild(v);
    } else {
      for (const r of conPoster) {
        const img = document.createElement('img');
        img.src = 'https://image.tmdb.org/t/p/w500/' + r.poster_path;
        img.alt = r.title || 'Póster';
        img.loading = 'lazy';
        img.onclick = async () => {
          try {
            await api('/' + registro.id, { method: 'PATCH', body: JSON.stringify({ poster: r.poster_path }) });
            registro.poster = r.poster_path;
            mostrarToast('Póster guardado');
            cerrarOverlay($overlayPoster);
            await cargar();
            setTimeout(() => abrirDetalle(registro), 250);
          } catch (err) {
            mostrarToast('Error guardando póster: ' + err.message);
          }
        };
        $posterGrid.appendChild(img);
      }
    }
    abrirOverlay($overlayPoster);
  }

  function cerrarSelectorPoster() { cerrarOverlay($overlayPoster); }

  async function guardar(e) {
    e.preventDefault();
    const body = {
      pelicula: capitalizar($formulario.fPelicula.value.trim()),
      poster: $formulario.fPoster.value.trim(),
      clase: $formulario.fClase.value,
      plataforma: $formulario.fPlataforma.value,
      etiquetas: etiquetasSeleccionadas,
      visto: $formulario.fVisto.value,
      dato: $formulario.fDato.value.trim(),
      nota: $formulario.fNota.value.trim(),
      anio: $formulario.fAnio.value.trim(),
      recomendable: $formulario.fRecomendable.checked
    };
    try {
      let registro;
      if (modo === 'crear') {
        registro = await api('', { method: 'POST', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
        // Auto-buscar portada solo al crear
        if (TMDB_TOKEN) {
          try {
            const esSerie = body.clase === 'serie';
            const data = await buscarPosterTMDb(body.pelicula, esSerie);
            if (data && data.results && data.results.length === 1) {
              const poster = data.results[0].poster_path;
              if (poster) {
                await api('/' + registro.id, { method: 'PATCH', body: JSON.stringify({ poster }) });
                registro.poster = poster;
                mostrarToast('Portada asignada');
              }
            } else if (data && data.results && data.results.length > 1) {
              cerrarModal();
              abrirSelectorPoster(data.results, registro);
              await cargar();
              return;
            }
          } catch (_) {
            // Si TMDB falla, continúa sin asignar portada
          }
        }
      } else {
        registro = await api('/' + idEditando, { method: 'PATCH', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
      }
      await cargar();
      cerrarModal();
      setTimeout(() => {
        if (registro) abrirDetalle(registro);
      }, 250);
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  async function eliminar(id, nombre) {
    if (!confirm('¿Eliminar "' + nombre + '"?')) return;
    try {
      await api('/' + id, { method: 'DELETE' });
      mostrarToast('Eliminado');
      await cargar();
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  const ESTADOS = ['Visto', 'Falta ver', 'Ver otra vez', 'Urgente', 'Viendo'];
  const CLASES = [
    { valor: 'película', etiqueta: 'Película', icono: 'ti ti-device-tv' },
    { valor: 'serie', etiqueta: 'Serie', icono: 'ti ti-armchair' }
  ];
  // 0 = sin orden, 1 = A-Z, 2 = Z-A
  let ordenAZ = 0;

  function resetCargaInfinita() {
    visiblesMostrados = LOTE;
  }

  function construirFiltros() {
    $filtros.innerHTML = '';
    const filaEstado = document.createElement('div');
    filaEstado.className = 'fila-filtros';
    const etiqueta = document.createElement('span');
    etiqueta.className = 'etiqueta-filtros';
    etiqueta.innerHTML = '<i class="ti ti-filter-code"></i> Filtros:';
    filaEstado.appendChild(etiqueta);
    const botones = [{ etiqueta: 'Todos', valor: '' }]
      .concat(ESTADOS.map(v => ({ etiqueta: v, valor: v })));
    for (const b of botones) {
      const btn = document.createElement('button');
      btn.className = 'chip' + (filtroVisto === b.valor ? ' activo' : '');
      btn.textContent = b.etiqueta;
      btn.onclick = () => {
        filtroVisto = filtroVisto === b.valor ? '' : b.valor;
        construirFiltros();
        resetCargaInfinita();
        render();
      };
      filaEstado.appendChild(btn);
    }
    // chip de orden
    const chipOrden = document.createElement('button');
    chipOrden.className = 'chip' + (ordenAZ ? ' activo' : '');
    chipOrden.innerHTML = ordenAZ === 1
      ? '<i class="ti ti-sort-a-z"></i> A-Z'
      : ordenAZ === 2
        ? '<i class="ti ti-sort-z-a"></i> Z-A'
        : '<i class="ti ti-sort-a-z"></i> A-Z';
    chipOrden.onclick = () => {
      ordenAZ = (ordenAZ + 1) % 3;
      construirFiltros();
      resetCargaInfinita();
      render();
    };
    filaEstado.appendChild(chipOrden);
    // chip de recomendados
    const chipReco = document.createElement('button');
    chipReco.className = 'chip' + (filtroRecomendado ? ' activo' : '');
    chipReco.innerHTML = '<i class="ti ti-thumb-up"></i> Mis recomendaciones';
    chipReco.onclick = () => {
      filtroRecomendado = filtroRecomendado ? '' : 'si';
      construirFiltros();
      resetCargaInfinita();
      render();
    };
    filaEstado.appendChild(chipReco);
    $filtros.appendChild(filaEstado);

    const filaClase = document.createElement('div');
    filaClase.className = 'fila-filtros';
    filaClase.style.marginLeft = 'auto';
    const etiquetaClase = document.createElement('span');
    etiquetaClase.className = 'etiqueta-filtros';
    etiquetaClase.innerHTML = '<i class="ti ti-category"></i> Clase:';
    filaClase.appendChild(etiquetaClase);
    for (const c of CLASES) {
      const activo = filtroClase === c.valor;
      const btn = document.createElement('button');
      btn.className = 'chip' + (activo ? ' activo' : '');
      const i = document.createElement('i');
      i.className = c.icono;
      btn.appendChild(i);
      btn.appendChild(document.createTextNode(' ' + c.etiqueta));
      btn.onclick = () => {
        filtroClase = filtroClase === c.valor ? '' : c.valor;
        construirFiltros();
        resetCargaInfinita();
        render();
      };
      filaClase.appendChild(btn);
    }
    $filtros.appendChild(filaClase);
  }

  let debounceTimer = null;
  $buscar.addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filtro = e.target.value.trim();
      resetCargaInfinita();
      render();
    }, 300);
  });

  $buscar.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    clearTimeout(debounceTimer);
    filtro = e.target.value.trim();
    resetCargaInfinita();
    render();
  });

  window.addEventListener('scroll', () => {
    $btnSubir.classList.toggle('visible', window.scrollY > 300);
    // carga infinita: cuando se acerca al final, muestra otros 20
    if (cargandoLote) return;
    const final = document.documentElement.scrollHeight - window.innerHeight;
    if (window.scrollY >= final - 600) {
      const total = document.querySelectorAll('#lista .tarjeta').length;
      if (total >= visiblesMostrados) {
        cargandoLote = true;
        visiblesMostrados += LOTE;
        render();
        cargandoLote = false;
      }
    }
  }, { passive: true });
  $btnSubir.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('btnAgregar').onclick = abrirCrear;
  document.getElementById('btnLimpiar').onclick = () => {
    $buscar.value = '';
    clearTimeout(debounceTimer);
    filtro = '';
    resetCargaInfinita();
    render();
    $buscar.focus();
  };
  document.getElementById('btnAleatorio').onclick = abrirAleatorio;
  document.getElementById('carruselPrev').onclick = () => moverCarrusel(-1);
  document.getElementById('carruselNext').onclick = () => moverCarrusel(1);
  $overlayAleatorio.addEventListener('click', e => { if (e.target === $overlayAleatorio) cerrarAleatorio(); });
  document.getElementById('btnAleaDetalle').onclick = () => {
    cerrarAleatorio();
    setTimeout(() => {
      if (aleaActual) abrirDetalle(aleaActual);
    }, 250);
  };
  document.getElementById('btnCancelar').onclick = cerrarModal;
  document.getElementById('btnEliminarPoster').onclick = () => {
    $formulario.fPoster.value = '';
    mostrarToast('Poster eliminado');
  };
  $formulario.fClase.addEventListener('change', actualizarLabelPelicula);
  $overlay.addEventListener('click', e => { if (e.target === $overlay) cerrarModal(); });
  $overlayDetalle.addEventListener('click', e => { if (e.target === $overlayDetalle) cerrarDetalle(); });
  document.getElementById('btnCerrarDetalle').onclick = cerrarDetalle;
  document.getElementById('btnCerrarPoster').onclick = cerrarSelectorPoster;
  $overlayPoster.addEventListener('click', e => { if (e.target === $overlayPoster) cerrarSelectorPoster(); });
  document.getElementById('btnCopiarPelicula').onclick = () => {
    const texto = $formulario.fPelicula.value;
    if (!texto) return;
    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  $btnCopiar.onclick = () => {
    if (!detalleActual) return;
    navigator.clipboard.writeText(detalleActual.pelicula).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  document.getElementById('btnEditarDesdeDetalle').onclick = () => {
    cerrarDetalle();
    setTimeout(() => {
      if (detalleActual) abrirEditar(detalleActual);
    }, 250);
  };
  $buscarEtiqueta.addEventListener('input', buscarEtiquetaDebounce);
  document.getElementById('btnLimpiarEtiqueta').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    $buscarEtiqueta.value = '';
    clearTimeout(buscarEtiquetaDebounce._t);
    $etiquetasResultados.innerHTML = '';
    $buscarEtiqueta.focus();
  };
  document.getElementById('btnMenu').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('menuPanel').classList.toggle('abierto');
  };
  document.addEventListener('click', () => document.getElementById('menuPanel').classList.remove('abierto'));
  // tooltip de plataforma: en táctil se muestra al tocar y se oculta al tocar fuera
  document.addEventListener('click', (e) => {
    const wrap = e.target.closest('.plataforma-tooltip-wrap');
    document.querySelectorAll('.plataforma-tooltip-wrap.mostrar').forEach(w => {
      if (w !== wrap) w.classList.remove('mostrar');
    });
    if (wrap) wrap.classList.toggle('mostrar');
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    cerrarDetalle();
    cerrarModal();
    cerrarSelectorPoster();
    cerrarAleatorio();
  });
  $formulario.addEventListener('submit', guardar);

  construirFiltros();

  cargarPlataformas().catch(err => console.error('Error cargando plataformas', err));
  cargarEtiquetas().catch(err => console.error('Error cargando etiquetas', err));

  cargar().catch(err => {
    $lista.innerHTML = '';
    const v = document.createElement('div');
    v.className = 'vacio';
    v.textContent = 'No se pudo cargar: ' + err.message;
    $lista.appendChild(v);
  });
</script>

</body>
</html>
