<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Videoteca</title>
  <link rel="icon" type="image/png" href="/assets/martian.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(150, 91, 239, .18);
    text-align: center;
  }
  html.tema-oscuro .login-card { box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
  .login-card .logo {
    display: block;
    width: 200px;
    height: 200px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid var(--morado);
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(150, 91, 239, .28);
  }
  .login-card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--morado);
    margin-bottom: 6px;
  }
  .login-card p.sub {
    color: var(--texto-suave);
    font-size: .9rem;
    margin-bottom: 26px;
  }
  .btn-google {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 18px;
    border-radius: 12px;
    border: 1px solid var(--borde);
    background: var(--superficie);
    color: var(--texto);
    font-size: .98rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn-google:hover { border-color: var(--morado); box-shadow: 0 4px 16px rgba(150, 91, 239, .2); }
  .btn-google:disabled { opacity: .6; cursor: default; box-shadow: none; }
  .btn-google svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .login-estado {
    margin-top: 20px;
    min-height: 22px;
    font-size: .88rem;
    color: var(--texto-suave);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .login-estado.error { color: var(--rojo); }
  .login-estado.exito { color: var(--morado); }
  .spinner-login {
    width: 16px;
    height: 16px;
    border: 2px solid var(--borde);
    border-top-color: var(--morado);
    border-radius: 50%;
    animation: girar-login .7s linear infinite;
  }
  @keyframes girar-login { to { transform: rotate(360deg); } }
  .login-nota {
    margin-top: 22px;
    font-size: .78rem;
    color: var(--texto-suave);
    line-height: 1.5;
  }
  .login-version {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    color: var(--morado);
  }
  .login-version i { font-size: .95rem; }
  .login-credito { margin-top: 4px; }
  .login-credito a { color: var(--morado); text-decoration: none; }
  .login-credito a:hover { text-decoration: underline; }
</style>
<script>
  // Aplicar el tema antes del primer render para evitar parpadeo
  (function () {
    var oscuro = localStorage.getItem('modoOscuro') !== 'false';
    if (oscuro) document.documentElement.classList.add('tema-oscuro');
  })();
</script>
<script src="/pb-sesion.js"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="logo" src="/assets/playing.jpg" alt="Videoteca">
    <h1>Videoteca</h1>
    <p class="sub"><i class="ti ti-player-play"></i> Tu cartelera personal te está esperando</p>

    <button type="button" class="btn-google" id="btnGoogle">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entra con Google
    </button>

    <div class="login-estado" id="estado"></div>

    <div class="login-nota">
      <div class="login-version"><i class="ti ti-tag"></i> Versión <span id="appVersion"></span></div>
      <div class="login-credito">Distribuido por: <br/> Carlos Pariona · <a href="https://infocatsoluciones.com" target="_blank" rel="noopener">https://infocatsoluciones.com</a></div>
    </div>
  </div>
</div>

<script>
  // Registro del service worker (para PWA/offline)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>

<script type="module">
  // ---------------------------------------------------------------------------
  // Autenticación OAuth2 con PocketBase usando SOLO la API REST (/api).
  // No se descarga ni se importa el SDK.
  //
  // Flujo (verificado contra el servidor):
  //   1. GET  /api/collections/users/auth-methods  -> authURL, codeVerifier, state
  //   2. GET  /api/realtime (SSE)                  -> event PB_CONNECT { clientId }
  //   3. POST /api/realtime { clientId, subscriptions:["@oauth2"] }
  //   4. Abrir popup a authURL con state=clientId y redirect_uri = /api/oauth2-redirect
  //   5. Google -> /api/oauth2-redirect -> PocketBase emite event @oauth2 { state, code }
  //   6. POST /api/collections/users/auth-with-oauth2 { provider, code, codeVerifier, redirectURL }
  // ---------------------------------------------------------------------------

  const PB = 'https://pb.infocatsoluciones.com';
  const COLECCION = 'users';
  const PROVIDER = 'google';
  const REDIRECT_URL = PB + '/api/oauth2-redirect';

  const $btn = document.getElementById('btnGoogle');
  const $estado = document.getElementById('estado');

  // Versión de la app (inyectada desde package.json en el build)
  document.getElementById('appVersion').textContent = __APP_VERSION__;

  let ocupado = false;

  function mostrarEstado(html, tipo) {
    $estado.className = 'login-estado' + (tipo ? ' ' + tipo : '');
    $estado.innerHTML = html || '';
  }

  function conSpinner(texto) {
    return '<span class="spinner-login"></span><span>' + texto + '</span>';
  }

  // --- Paso 2: conexión realtime (SSE) ---------------------------------------
  function conectarRealtime() {
    return new Promise((resolve, reject) => {
      const es = new EventSource(PB + '/api/realtime');
      const timeout = setTimeout(() => {
        es.close();
        reject(new Error('No se pudo conectar con el servidor.'));
      }, 12000);

      es.addEventListener('PB_CONNECT', async (ev) => {
        clearTimeout(timeout);
        try {
          const { clientId } = JSON.parse(ev.data);
          const res = await fetch(PB + '/api/realtime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId, subscriptions: ['@oauth2'] })
          });
          if (!res.ok) throw new Error('No se pudo suscribir al canal de autenticación.');
          resolve({ es, clientId });
        } catch (err) {
          es.close();
          reject(err);
        }
      });
    });
  }

  // --- Paso 5: esperar el código que envía PocketBase ------------------------
  function esperarCodigo(es, clientId, popup) {
    return new Promise((resolve, reject) => {
      const terminar = (fn, valor) => {
        limpiar();
        fn(valor);
      };
      const alRecibir = (ev) => {
        let datos;
        try { datos = JSON.parse(ev.data); } catch (_) { return; }
        if (!datos || datos.state !== clientId) return;
        if (datos.error || !datos.code) {
          terminar(reject, new Error('cancelado'));
        } else {
          terminar(resolve, datos.code);
        }
      };
      const vigilante = setInterval(() => {
        if (popup && popup.closed) terminar(reject, new Error('cancelado'));
      }, 700);
      const timeout = setTimeout(() => terminar(reject, new Error('La autenticación tardó demasiado. Inténtalo de nuevo.')), 180000);
      function limpiar() {
        es.removeEventListener('@oauth2', alRecibir);
        clearInterval(vigilante);
        clearTimeout(timeout);
      }
      es.addEventListener('@oauth2', alRecibir);
    });
  }

  // --- Flujo completo --------------------------------------------------------
  async function iniciarSesion() {
    if (ocupado) return;
    ocupado = true;
    $btn.disabled = true;
    mostrarEstado(conSpinner('Conectando…'));

    // El popup se abre de inmediato (antes de cualquier await) para que el
    // navegador no lo bloquee.
    const popup = window.open('', 'pb_oauth', 'width=520,height=680');
    if (!popup) {
      ocupado = false;
      $btn.disabled = false;
      mostrarEstado('<i class="ti ti-alert-triangle"></i> Tu navegador bloqueó la ventana emergente. Permite las ventanas emergentes e inténtalo de nuevo.', 'error');
      return;
    }
    try {
      popup.document.write('<p style="font-family:system-ui,sans-serif;padding:24px;color:#666">Cargando Google…</p>');
    } catch (_) {}

    let es = null;
    try {
      const realtime = await conectarRealtime();
      es = realtime.es;

      const resMethods = await fetch(PB + '/api/collections/' + COLECCION + '/auth-methods');
      if (!resMethods.ok) throw new Error('No se pudieron consultar los métodos de acceso.');
      const methods = await resMethods.json();
      const provider = ((methods.oauth2 && methods.oauth2.providers) || []).find(p => p.name === PROVIDER);
      if (!provider) throw new Error('El proveedor Google no está habilitado.');

      const url = new URL(provider.authURL + encodeURIComponent(REDIRECT_URL));
      url.searchParams.set('state', realtime.clientId);

      mostrarEstado(conSpinner('Esperando a Google…'));
      popup.location.href = url.toString();

      const code = await esperarCodigo(es, realtime.clientId, popup);

      mostrarEstado(conSpinner('Validando sesión…'));
      const resAuth = await fetch(PB + '/api/collections/' + COLECCION + '/auth-with-oauth2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: PROVIDER,
          code: code,
          codeVerifier: provider.codeVerifier,
          redirectURL: REDIRECT_URL
        })
      });
      if (!resAuth.ok) {
        let msg = 'No se pudo completar el inicio de sesión.';
        try { const e = await resAuth.json(); if (e && e.message) msg = e.message; } catch (_) {}
        throw new Error(msg);
      }
      const datos = await resAuth.json();
      PBSesion.guardar(datos);

      mostrarEstado('<i class="ti ti-circle-check"></i> ¡Listo! Entrando…', 'exito');
      location.replace('/peliculas.html');
    } catch (err) {
      try { if (popup && !popup.closed) popup.close(); } catch (_) {}
      if (err && err.message === 'cancelado') {
        mostrarEstado('<i class="ti ti-info-circle"></i> Inicio de sesión cancelado.', '');
      } else {
        mostrarEstado('<i class="ti ti-alert-triangle"></i> ' + (err.message || 'Ocurrió un error.'), 'error');
      }
      ocupado = false;
      $btn.disabled = false;
    } finally {
      if (es) es.close();
    }
  }

  // Si ya hay una sesión válida, saltar directo a la app.
  if (PBSesion.leer()) {
    mostrarEstado(conSpinner('Sesión activa, entrando…'));
    location.replace('/peliculas.html');
  }

  $btn.addEventListener('click', iniciarSesion);
</script>

</body>
</html>
