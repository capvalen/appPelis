<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos - Infocat</title>
  <link rel="icon" type="image/png" href="/assets/martian.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
	<link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
<style>
  /* buscador de juegos (SteamGridDB) */
  .buscar-juego-resultados {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 4px;
  }
  .buscar-juego-resultados button {
    width: 100%;
    justify-content: flex-start;
    text-align: left;
    background: var(--superficie-suave);
    border: 1px solid var(--borde);
    color: var(--texto);
    font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .buscar-juego-resultados button:hover {
    background: var(--morado-claro);
    border-color: var(--morado);
    color: var(--morado-oscuro);
  }
</style>
<script>
  // Aplicar el tema antes del primer render para evitar parpadeo
  (function () {
    var oscuro = localStorage.getItem('modoOscuro') !== 'false';
    if (oscuro) document.documentElement.classList.add('tema-oscuro');
  })();
</script>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <img class="logo" src="/assets/martian.png" alt="Videoteca">
    <h1>Juegos ~ Infocat</h1>
  </div>
  <div style="display:flex; align-items:center; gap:6px;">
    <div class="menu-wrap">
      <button type="button" class="btn-menu" id="btnMenu" title="Menú"><i class="ti ti-menu-2"></i></button>
      <nav class="menu-panel" id="menuPanel">
        <a href="/index.html"><i class="ti ti-device-tv"></i> Películas / Series</a>
        <a href="/juegos.html" class="activo"><i class="ti ti-device-gamepad"></i> Juegos</a>
        <a href="/config.html"><i class="ti ti-settings"></i> Configuración</a>
      </nav>
    </div>
    <a class="btn-config" href="/config.html" title="Configuración"><i class="ti ti-settings"></i></a>
  </div>
</header>

<div class="carrusel-wrap" id="carruselWrap">
  <div class="carrusel-titulo"><i class="ti ti-swipe"></i> Jugado últimamente</div>
  <button class="carrusel-btn prev" id="carruselPrev" title="Anterior"><i class="ti ti-chevron-left"></i></button>
  <div class="carrusel" id="carrusel"></div>
  <button class="carrusel-btn next" id="carruselNext" title="Siguiente"><i class="ti ti-chevron-right"></i></button>
</div>

<div class="toolbar">
  <div class="buscar-wrap">
    <input type="text" id="buscar" placeholder="Buscar por juego o información...">
    <button class="btn-limpiar" id="btnLimpiar" title="Limpiar búsqueda"><i class="ti ti-eraser"></i></button>
  </div>
  <button class="btn-primario" id="btnAgregar"><i class="ti ti-plus"></i> Agregar</button>
</div>
<div class="filtros" id="filtros"></div>
<div class="contador" id="contador"></div>
<div id="lista"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitulo">Agregar juego</h2>
    <form id="formulario">
      <input type="hidden" id="fId">
      <div class="campo">
        <label for="fPelicula"><i class="ti ti-device-gamepad"></i> <span id="labelPelicula">Nombre del juego</span></label>
        <div class="campo-con-boton">
          <input type="text" id="fPelicula" required>
          <button type="button" class="btn-copiar" id="btnCopiarPelicula" title="Copiar nombre"><i class="ti ti-clipboard"></i></button>
        </div>
      </div>
      <div class="campo">
        <input type="hidden" id="fPoster">
        <button type="button" class="btn-secundario" id="btnEliminarPoster"><i class="ti ti-trash"></i> Eliminar poster</button>
      </div>
      <div class="campo">
        <label for="fDato"><i class="ti ti-info-circle"></i> Información adicional</label>
        <input type="text" id="fDato">
      </div>
      <div class="campo">
        <label for="fUbicacion"><i class="ti ti-map-pin"></i> Ubicación</label>
        <input type="text" id="fUbicacion" placeholder="¿Dónde está guardado?">
      </div>
      <div class="campo">
        <label for="fVisto"><i class="ti ti-eye"></i> Estado</label>
        <select id="fVisto">
          <option>Pendiente</option>
          <option>Jugando</option>
          <option>Jugado</option>
          <option>Volver a jugar</option>
        </select>
      </div>
      <div class="campo">
        <label for="fNota"><i class="ti ti-star"></i> Calificación</label>
        <input type="number" id="fNota" min="0" max="5" step="0.1">
      </div>
      <div class="campo">
        <label for="fAnio"><i class="ti ti-calendar"></i> Año</label>
        <input type="number" id="fAnio" min="1888" max="2100" step="1">
      </div>
      <div class="campo">
        <label for="fRecomendable"><i class="ti ti-thumb-up"></i> Recomendable</label>
        <div class="switch">
          <input type="checkbox" id="fRecomendable">
          <span class="pista"></span>
          <span class="perilla"></span>
        </div>
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn-secundario btn-volver" id="btnCancelar"><i class="ti ti-arrow-left"></i> Volver</button>
        <button type="submit" class="btn-primario" id="btnGuardar"><i class="ti ti-device-floppy"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="overlayDetalle">
  <div class="modal modal-detalle">
    <div id="dPoster">
      <button type="button" class="btn-buscar-portada" id="btnBuscarPortada"><i class="ti ti-photo-search"></i> Buscar portada</button>
    </div>
    <div class="titulo-fila">
      <div class="titulo" id="dPelicula"></div>
      <button type="button" class="btn-copiar" id="btnCopiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>
    </div>
    <div class="sub" id="dVisto"></div>
    <div class="detalle-fila"><span class="etiqueta">Información</span><span class="valor" id="dDato"></span></div>
    <div class="detalle-fila"><span class="etiqueta">Ubicación</span><span class="valor" id="dUbicacion"></span></div>
    <div class="detalle-fila"><span class="etiqueta">Calificación</span><span class="valor" id="dNota"></span></div>
    <div class="detalle-fila" id="dRecomendableFila" style="display:none"><span class="etiqueta">Recomendada</span><span class="valor"><span class="btn-recomendar on"><i class="ti ti-thumb-up"></i> Recomendada</span></span></div>
    <div class="modal-acciones">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarDetalle"><i class="ti ti-arrow-left"></i> Volver</button>
      <button type="button" class="btn-primario" id="btnEditarDesdeDetalle"><i class="ti ti-pencil"></i> Editar</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayAleatorio">
  <div class="modal modal-aleatorio">
    <h2><i class="ti ti-dice-5"></i> Juego aleatorio</h2>
    <div class="alea-busqueda" id="aleaBusqueda">
      <img id="aleaDado" src="/assets/dice_1.png" alt="Dado">
      <span><i class="ti ti-player-track-next"></i> Buscando...</span>
    </div>
    <div class="alea-resultado" id="aleaResultado"></div>
    <div class="modal-acciones">
      <button type="button" class="btn-primario" id="btnAleaDetalle" style="display:none"><i class="ti ti-eye"></i> Ver</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayPoster">
  <div class="modal modal-poster">
    <h2>Elige una portada</h2>
    <div id="posterGrid" class="grid-poster"></div>
    <div class="modal-acciones">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarPoster"><i class="ti ti-arrow-left"></i> Volver</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayBuscarJuego">
  <div class="modal">
    <h2><i class="ti ti-search"></i> Buscar juego</h2>
    <div class="campo">
      <label for="buscarJuegoInput"><i class="ti ti-device-gamepad"></i> Nombre del juego</label>
      <input type="text" id="buscarJuegoInput" placeholder="Escribe para buscar...">
    </div>
    <div class="modal-acciones" style="margin-top:0; margin-bottom:14px;">
      <button type="button" class="btn-secundario btn-volver" id="btnCerrarBuscarJuego"><i class="ti ti-arrow-left"></i> Volver</button>
      <button type="button" class="btn-primario" id="btnBuscarJuego"><i class="ti ti-search"></i> Buscar</button>
    </div>
    <div class="buscar-juego-resultados" id="buscarJuegoResultados"></div>
  </div>
</div>

<div id="toast"></div>

<button id="btnAleatorio" title="Juego aleatorio"><i class="ti ti-dice-5"></i></button>
<button id="btnSubir" title="Ir al inicio"><i class="ti ti-chevron-up"></i></button>

<script type="module">
  const BASE = 'https://pb.infocatsoluciones.com/api/collections/is_peliculas/records';
  const STEAM_PROXY = 'https://steam-db.infocatsoluciones.deno.net/api';

  const $lista = document.getElementById('lista');
  const $buscar = document.getElementById('buscar');
  const $contador = document.getElementById('contador');
  const $filtros = document.getElementById('filtros');
  const $overlay = document.getElementById('overlay');
  const $formulario = document.getElementById('formulario');
  const $modalTitulo = document.getElementById('modalTitulo');
  const $toast = document.getElementById('toast');
  const $btnSubir = document.getElementById('btnSubir');
  const $overlayDetalle = document.getElementById('overlayDetalle');
  const $dPoster = document.getElementById('dPoster');
  const $dPelicula = document.getElementById('dPelicula');
  const $btnCopiar = document.getElementById('btnCopiar');
  const $dVisto = document.getElementById('dVisto');
  const $dDato = document.getElementById('dDato');
  const $dUbicacion = document.getElementById('dUbicacion');
  const $dNota = document.getElementById('dNota');
  const $dRecomendableFila = document.getElementById('dRecomendableFila');
  const $overlayAleatorio = document.getElementById('overlayAleatorio');
  const $aleaBusqueda = document.getElementById('aleaBusqueda');
  const $aleaResultado = document.getElementById('aleaResultado');
  const $btnAleaDetalle = document.getElementById('btnAleaDetalle');
  const $aleaDado = document.getElementById('aleaDado');
  const $overlayPoster = document.getElementById('overlayPoster');
  const $posterGrid = document.getElementById('posterGrid');
  const $overlayBuscarJuego = document.getElementById('overlayBuscarJuego');
  const $buscarJuegoInput = document.getElementById('buscarJuegoInput');
  const $buscarJuegoResultados = document.getElementById('buscarJuegoResultados');
  const $carrusel = document.getElementById('carrusel');
  const $carruselWrap = document.getElementById('carruselWrap');

  let peliculas = [];
  let filtro = '';
  let filtroVisto = '';
  let modo = 'crear';
  let idEditando = null;
  let detalleActual = null;
  let posterRegistro = null;
  let juegoSteamId = null; // id de SteamGridDB del juego en creación
  let aleaActual = null;
  let aleaIntervalo = null;
  let aleaCara = 1;
  // modo de vista y carga infinita
  let modoVista = localStorage.getItem('modoVista') === 'titulos' ? 'titulos' : 'portada';
  const LOTE = 20;
  let visiblesMostrados = LOTE;
  let cargandoLote = false;

  function normalizar(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function capitalizar(s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  async function api(path = '', options = {}) {
    const res = await fetch(BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) {
      let msg = 'Error ' + res.status;
      try {
        const e = await res.json();
        msg = e.message || msg;
      } catch (_) {}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  }

  async function cargar() {
    $carruselWrap.style.display = 'none';
    let page = 1;
    let items = [];
    while (true) {
      const data = await api('?page=' + page + '&perPage=500&sort=-created&filter=' + encodeURIComponent('clase = "juego"'));
      items = items.concat(data.items);
      if (page >= data.totalPages) break;
      page++;
    }
    peliculas = items;
    render();
    cargarCarrusel();
  }

  async function cargarCarrusel() {
    try {
      const data = await api('?perPage=10&filter=' + encodeURIComponent('(visto="Jugado") && clase = "juego"') + '&sort=-updated');
      $carrusel.innerHTML = '';
      if (!data.items || !data.items.length) {
        $carruselWrap.style.display = 'none';
        return;
      }
      $carruselWrap.style.display = '';
      for (const p of data.items) {
        const div = document.createElement('div');
        div.className = 'carrusel-item';
        const img = document.createElement('img');
        img.src = p.poster ? p.poster : '/assets/movies.webp';
        img.alt = p.pelicula;
        img.loading = 'lazy';
        div.appendChild(img);
        div.onclick = () => abrirDetalle(p);
        $carrusel.appendChild(div);
      }
      iniciarAutoScroll();
    } catch (_) {
      $carruselWrap.style.display = 'none';
    }
  }

  let carruselTimer = null;
  function tarjetaVisible() {
    return window.innerWidth <= 640 ? 3 : 5;
  }
  function pasoCarrusel() {
    // ancho real de una tarjeta + su gap, para que el destino coincida con el inicio de la siguiente
    const primera = $carrusel.querySelector('.carrusel-item');
    if (!primera) return 1;
    const gap = 10;
    return primera.offsetWidth + gap;
  }
  function moverCarrusel(dir) {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    let destino = Math.min(Math.max($carrusel.scrollLeft + dir * paso, 0), maxScroll);
    $carrusel.scrollTo({ left: destino, behavior: 'smooth' });
    // reinicia el temporizador para que no avance justo después de navegar
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  function autoScroll() {
    const paso = pasoCarrusel();
    const maxScroll = $carrusel.scrollWidth - $carrusel.clientWidth;
    const proximo = $carrusel.scrollLeft + paso;
    if (proximo >= maxScroll - 1) {
      $carrusel.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      $carrusel.scrollBy({ left: paso, behavior: 'smooth' });
    }
  }
  function iniciarAutoScroll() {
    clearInterval(carruselTimer);
    carruselTimer = setInterval(autoScroll, 6000);
  }
  window.addEventListener('resize', () => {
    clearInterval(carruselTimer);
    if ($carruselWrap.style.display !== 'none') iniciarAutoScroll();
  });

  function badge(visto) {
    const cls = visto === 'Jugado' ? 'Jugado'
      : visto === 'Jugando' ? 'Jugando'
      : visto === 'Volver a jugar' ? 'Volver'
      : 'Pendiente';
    return '<span class="badge ' + cls + '">' + (visto || 'Pendiente') + '</span>';
  }

  function badgeClase(clase) {
    const c = (clase || '').toLowerCase();
    if (c === 'juego') {
      return '<span class="badge clase"><i class="ti ti-device-gamepad"></i> Juego</span>';
    }
    if (c === 'serie') {
      return '<span class="badge clase"><i class="ti ti-armchair"></i> Serie</span>';
    }
    return '<span class="badge clase"><i class="ti ti-device-tv"></i> Película</span>';
  }

  function tituloConAnio(p) {
    const base = capitalizar(p.pelicula);
    return p.anio ? base + ' (' + p.anio + ')' : base;
  }

  function tarjeta(p) {
    if (modoVista === 'portada') {
      const div = document.createElement('div');
      div.className = 'tarjeta portada';
      const imgSrc = p.poster
        ? p.poster
        : '/assets/playing.jpg';
      div.innerHTML =
        '<img src="' + imgSrc + '" alt="' + p.pelicula + '" loading="lazy">' +
        '<div class="info">' +
          '<div class="nombre"></div>' +
          '<div class="meta">' +
            (p.nota ? '<span class="nota"><i class="ti ti-star-filled estrella"></i> ' + p.nota + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="acciones">' +
          '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
          '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
        '</div>';
      div.querySelector('.nombre').textContent = capitalizar(p.pelicula);
      div.onclick = () => abrirDetalle(p);
      div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
      div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
      return div;
    }
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML =
      '<div class="nombre"></div>' +
      '<div class="meta">' + badge(p.visto) + badgeClase(p.clase) +
        (p.dato ? '<span class="dato">' + p.dato + '</span>' : '') +
        (p.nota ? '<span class="nota">'  + ' <i class="ti ti-star-filled estrella"></i> ' + p.nota + '</span>' : '') +
      '</div>' +
      '<div class="acciones">' +
        '<button class="btn-icono editar" title="Editar"><i class="ti ti-pencil"></i></button>' +
        '<button class="btn-icono borrar" title="Eliminar"><i class="ti ti-trash"></i></button>' +
      '</div>';
    div.querySelector('.nombre').textContent = tituloConAnio(p);
    div.onclick = () => abrirDetalle(p);
    div.querySelector('.editar').onclick = (e) => { e.stopPropagation(); abrirEditar(p); };
    div.querySelector('.borrar').onclick = (e) => { e.stopPropagation(); eliminar(p.id, p.pelicula); };
    return div;
  }

  function render() {
    const q = normalizar(filtro);
    const visibles = peliculas.filter(p => {
      if (filtroVisto && p.visto !== filtroVisto) return false;
      if (!q) return true;
      return normalizar(p.pelicula).includes(q) || normalizar(p.dato || '').includes(q);
    });
    const texto = visibles.length + ' juego' + (visibles.length === 1 ? '' : 's');
    $contador.textContent = texto;
    $lista.classList.toggle('modo-portada', modoVista === 'portada');
    $lista.innerHTML = '';
    if (!peliculas.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Cargando...';
      $lista.appendChild(v);
      return;
    }
    if (!visibles.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Sin resultados para "' + filtro + '"';
      $lista.appendChild(v);
      return;
    }
    if (ordenAZ) {
      visibles.sort((a, b) => a.pelicula.localeCompare(b.pelicula, 'es') * (ordenAZ === 2 ? -1 : 1));
    }
    const aMostrar = visibles.slice(0, visiblesMostrados);
    for (const p of aMostrar) $lista.appendChild(tarjeta(p));
    if (visibles.length > visiblesMostrados) {
      const c = document.createElement('div');
      c.className = 'cargando';
      c.textContent = 'Cargando más...';
      c.id = 'indicadorCarga';
      $lista.appendChild(c);
    }
  }

  function mostrarToast(msg) {
    $toast.innerHTML = '<i class="ti ti-location-check"></i>' + msg;
    $toast.classList.add('visible');
    clearTimeout(mostrarToast._t);
    mostrarToast._t = setTimeout(() => $toast.classList.remove('visible'), 2500);
  }

  function abrirOverlay($el) {
    $el.style.display = 'flex';
    $el.offsetHeight; // forzar reflow
    $el.classList.add('abierto', 'animado');
  }
  function cerrarOverlay($el) {
    $el.classList.remove('animado');
    setTimeout(() => {
      $el.classList.remove('abierto');
      $el.style.display = '';
    }, 250);
  }

  function abrirModal() { abrirOverlay($overlay); }
  function cerrarModal() { cerrarOverlay($overlay); }

  function abrirDetalle(p) {
    detalleActual = p;
    $dPelicula.textContent = tituloConAnio(p);
    $dVisto.innerHTML = badge(p.visto) + badgeClase(p.clase);
    $dDato.textContent = p.dato ? p.dato : '—';
    $dUbicacion.textContent = p.ubicacion ? p.ubicacion : '—';
    $dNota.innerHTML = p.nota
      ? '<i class="ti ti-star-filled estrella"></i> ' + p.nota
      : '—';
    $dRecomendableFila.style.display = p.recomendable ? '' : 'none';
    mostrarPoster(p.poster);
    abrirOverlay($overlayDetalle);
  }

  function mostrarPoster(poster) {
    $dPoster.innerHTML = '';
    $dPoster.className = '';
    if (!poster) {
      $dPoster.className = 'sin-poster';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-buscar-portada';
      btn.id = 'btnBuscarPortada';
      btn.innerHTML = '<i class="ti ti-photo-search"></i> Buscar portada';
      btn.onclick = () => {
        if (detalleActual && detalleActual.id_auxiliar) {
          abrirSelectorPortada(detalleActual.id_auxiliar, detalleActual.pelicula, detalleActual);
        } else {
          abrirBuscarJuego();
        }
      };
      $dPoster.appendChild(btn);
      return;
    }
    $dPoster.className = 'tiene-poster';
    const img = document.createElement('img');
    img.src = poster;
    img.alt = 'Póster';
    img.onerror = () => { $dPoster.innerHTML = ''; $dPoster.className = ''; };
    $dPoster.appendChild(img);
  }

  function cerrarDetalle() { cerrarOverlay($overlayDetalle); }

  function abrirAleatorio() {
    const candidatas = peliculas.filter(p => p.visto === 'Pendiente' || p.visto === 'Volver a jugar');
    aleaActual = null;
    $btnAleaDetalle.style.display = 'none';
    $aleaResultado.classList.remove('visible');
    $aleaResultado.innerHTML = '';
    $aleaBusqueda.style.display = 'flex';
    if (!candidatas.length) {
      $aleaBusqueda.innerHTML = '<i class="ti ti-alert-triangle"></i> No hay películas pendientes';
      abrirOverlay($overlayAleatorio);
      return;
    }
    abrirOverlay($overlayAleatorio);
    // efecto de dados: alterna dice_1 / dice_2 en bucle mientras "sortean"
    clearInterval(aleaIntervalo);
    aleaCara = 1;
    $aleaDado.src = '/assets/dice_1.png';
    aleaIntervalo = setInterval(() => {
      aleaCara = aleaCara === 1 ? 2 : 1;
      $aleaDado.src = '/assets/dice_' + aleaCara + '.png';
    }, 250);
    // efecto de búsqueda por 1 segundo, luego elige al azar
    setTimeout(() => {
      clearInterval(aleaIntervalo);
      aleaIntervalo = null;
      const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
      aleaActual = elegida;
      $aleaBusqueda.style.display = 'none';
      $aleaResultado.innerHTML =
        '<img class="alea-img" src="/assets/movies.webp" alt="Película">' +
        '<div class="alea-hora">Es hora de ver...</div>' +
        '<div class="alea-titulo-fila">' +
          '<div class="alea-titulo">' + tituloConAnio(elegida) + '</div>' +
          '<button type="button" class="btn-copiar" title="Copiar título"><i class="ti ti-clipboard"></i></button>' +
        '</div>' +
        '<div class="alea-meta">' + badge(elegida.visto) + badgeClase(elegida.clase) + '</div>';
      $aleaResultado.querySelector('.btn-copiar').onclick = () => {
        navigator.clipboard.writeText(elegida.pelicula).then(() => {
          mostrarToast('Título copiado');
        }).catch(() => {
          mostrarToast('Error al copiar');
        });
      };
      $aleaResultado.classList.add('visible');
      $btnAleaDetalle.style.display = '';
    }, 1000);
  }

  function cerrarAleatorio() {
    clearInterval(aleaIntervalo);
    aleaIntervalo = null;
    cerrarOverlay($overlayAleatorio);
  }

  function abrirCrear() {
    modo = 'crear';
    idEditando = null;
    juegoSteamId = null;
    $formulario.reset();
    $formulario.fPoster.value = '';
    $formulario.fVisto.value = 'Pendiente';
    $formulario.fRecomendable.checked = false;
    document.getElementById('btnEliminarPoster').style.display = 'none';
    $modalTitulo.textContent = 'Agregar juego';
    abrirBuscarJuego();
  }

  function abrirEditar(p) {
    modo = 'editar';
    idEditando = p.id;
    $formulario.fId.value = p.id;
    $formulario.fPelicula.value = p.pelicula;
    $formulario.fPoster.value = p.poster || '';
    $formulario.fVisto.value = p.visto;
    $formulario.fDato.value = p.dato || '';
    $formulario.fUbicacion.value = p.ubicacion || '';
    $formulario.fNota.value = p.nota || '';
    $formulario.fAnio.value = p.anio || '';
    $formulario.fRecomendable.checked = !!p.recomendable;
    document.getElementById('btnEliminarPoster').style.display = '';
    $modalTitulo.textContent = 'Editar juego';
    abrirModal();
    $formulario.fPelicula.focus();
  }

  async function buscarJuegoSteam(query) {
    const url = STEAM_PROXY + '/buscar/' + encodeURIComponent(query);
    const res = await fetch(url);
    if (!res.ok) throw new Error('Error buscando juego: ' + res.status);
    return res.json();
  }

  async function buscarPortadasSteam(id) {
    const url = STEAM_PROXY + '/portadas/' + encodeURIComponent(id);
    const res = await fetch(url);
    if (!res.ok) throw new Error('Error buscando portadas: ' + res.status);
    return res.json();
  }

  function abrirBuscarJuego() {
    juegoSteamId = null;
    $buscarJuegoInput.value = '';
    $buscarJuegoResultados.innerHTML = '';
    abrirOverlay($overlayBuscarJuego);
    $buscarJuegoInput.focus();
  }

  function cerrarBuscarJuego() { cerrarOverlay($overlayBuscarJuego); }

  async function ejecutarBuscarJuego() {
    const q = $buscarJuegoInput.value.trim();
    if (!q) return;
    $buscarJuegoResultados.innerHTML = '<div class="cargando">Buscando...</div>';
    try {
      const data = await buscarJuegoSteam(q);
      const items = (data && data.data) || [];
      $buscarJuegoResultados.innerHTML = '';
      if (!items.length) {
        $buscarJuegoResultados.innerHTML = '<div class="sin-poster">Sin resultados para "' + q + '"</div>';
        return;
      }
      // Si hay exactamente 1 resultado, tomarlo directo y abrir el selector de portadas
      if (items.length === 1) {
        const g = items[0];
        juegoSteamId = g.id;
        $formulario.fPelicula.value = g.name;
        cerrarBuscarJuego();
        abrirSelectorPortada(g.id, g.name);
        return;
      }
      for (const g of items) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = g.name;
        btn.onclick = () => {
          juegoSteamId = g.id;
          $formulario.fPelicula.value = g.name;
          cerrarBuscarJuego();
          abrirSelectorPortada(g.id, g.name);
        };
        $buscarJuegoResultados.appendChild(btn);
      }
    } catch (err) {
      $buscarJuegoResultados.innerHTML = '<div class="sin-poster">Error: ' + err.message + '</div>';
    }
  }

  async function abrirSelectorPortada(steamId, nombre, registro) {
    $posterGrid.innerHTML = '<div class="cargando">Buscando portadas...</div>';
    try {
      const data = await buscarPortadasSteam(steamId);
      const grids = (data && data.data) || [];
      $posterGrid.innerHTML = '';
      if (!grids.length) {
        const v = document.createElement('div');
        v.className = 'sin-poster';
        v.textContent = 'Sin portadas disponibles';
        $posterGrid.appendChild(v);
        return;
      }
      for (const g of grids) {
        const urlPortada = g.thumb || g.url;
        const img = document.createElement('img');
        img.src = urlPortada;
        img.alt = nombre || 'Portada';
        img.loading = 'lazy';
        img.onclick = async () => {
          if (registro) {
            try {
              await api('/' + registro.id, { method: 'PATCH', body: JSON.stringify({ poster: urlPortada }) });
              registro.poster = urlPortada;
              mostrarToast('Portada guardada');
              cerrarOverlay($overlayPoster);
              await cargar();
              setTimeout(() => abrirDetalle(registro), 250);
            } catch (err) {
              mostrarToast('Error guardando portada: ' + err.message);
            }
            return;
          }
          $formulario.fPoster.value = urlPortada;
          cerrarOverlay($overlayPoster);
          mostrarToast('Portada seleccionada');
          abrirModal();
          $formulario.fPelicula.focus();
        };
        $posterGrid.appendChild(img);
      }
      abrirOverlay($overlayPoster);
    } catch (err) {
      $posterGrid.innerHTML = '<div class="sin-poster">Error: ' + err.message + '</div>';
    }
  }

  function cerrarSelectorPoster() { cerrarOverlay($overlayPoster); }

  async function guardar(e) {
    e.preventDefault();
    const body = {
      pelicula: $formulario.fPelicula.value.trim(),
      poster: $formulario.fPoster.value.trim(),
      clase: 'juego',
      visto: $formulario.fVisto.value,
      dato: $formulario.fDato.value.trim(),
      ubicacion: $formulario.fUbicacion.value.trim(),
      nota: $formulario.fNota.value.trim(),
      anio: $formulario.fAnio.value.trim(),
      recomendable: $formulario.fRecomendable.checked
    };
    if (juegoSteamId) body.id_auxiliar = juegoSteamId;
    try {
      let registro;
      if (modo === 'crear') {
        registro = await api('', { method: 'POST', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
      } else {
        registro = await api('/' + idEditando, { method: 'PATCH', body: JSON.stringify(body) });
        mostrarToast('Guardado correctamente');
      }
      await cargar();
      cerrarModal();
      setTimeout(() => {
        if (registro) abrirDetalle(registro);
      }, 250);
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  async function eliminar(id, nombre) {
    if (!confirm('¿Eliminar "' + nombre + '"?')) return;
    try {
      await api('/' + id, { method: 'DELETE' });
      mostrarToast('Eliminado');
      await cargar();
    } catch (err) {
      mostrarToast('Error: ' + err.message);
    }
  }

  const ESTADOS = ['Pendiente', 'Jugando', 'Jugado', 'Volver a jugar'];
  // 0 = sin orden, 1 = A-Z, 2 = Z-A
  let ordenAZ = 0;

  function resetCargaInfinita() {
    visiblesMostrados = LOTE;
  }

  function construirFiltros() {
    $filtros.innerHTML = '';
    const filaEstado = document.createElement('div');
    filaEstado.className = 'fila-filtros';
    const etiqueta = document.createElement('span');
    etiqueta.className = 'etiqueta-filtros';
    etiqueta.innerHTML = '<i class="ti ti-filter-code"></i> Filtros:';
    filaEstado.appendChild(etiqueta);
    const botones = [{ etiqueta: 'Todos', valor: '' }]
      .concat(ESTADOS.map(v => ({ etiqueta: v, valor: v })));
    for (const b of botones) {
      const btn = document.createElement('button');
      btn.className = 'chip' + (filtroVisto === b.valor ? ' activo' : '');
      btn.textContent = b.etiqueta;
      btn.onclick = () => {
        filtroVisto = filtroVisto === b.valor ? '' : b.valor;
        construirFiltros();
        resetCargaInfinita();
        render();
      };
      filaEstado.appendChild(btn);
    }
    // chip de orden
    const chipOrden = document.createElement('button');
    chipOrden.className = 'chip' + (ordenAZ ? ' activo' : '');
    chipOrden.innerHTML = ordenAZ === 1
      ? '<i class="ti ti-sort-a-z"></i> A-Z'
      : ordenAZ === 2
        ? '<i class="ti ti-sort-z-a"></i> Z-A'
        : '<i class="ti ti-sort-a-z"></i> A-Z';
    chipOrden.onclick = () => {
      ordenAZ = (ordenAZ + 1) % 3;
      construirFiltros();
      resetCargaInfinita();
      render();
    };
    filaEstado.appendChild(chipOrden);
    $filtros.appendChild(filaEstado);
  }

  let debounceTimer = null;
  $buscar.addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filtro = e.target.value.trim();
      resetCargaInfinita();
      render();
    }, 300);
  });

  $buscar.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    clearTimeout(debounceTimer);
    filtro = e.target.value.trim();
    resetCargaInfinita();
    render();
  });

  window.addEventListener('scroll', () => {
    $btnSubir.classList.toggle('visible', window.scrollY > 300);
    // carga infinita: cuando se acerca al final, muestra otros 20
    if (cargandoLote) return;
    const final = document.documentElement.scrollHeight - window.innerHeight;
    if (window.scrollY >= final - 600) {
      const total = document.querySelectorAll('#lista .tarjeta').length;
      if (total >= visiblesMostrados) {
        cargandoLote = true;
        visiblesMostrados += LOTE;
        render();
        cargandoLote = false;
      }
    }
  }, { passive: true });
  $btnSubir.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('btnAgregar').onclick = abrirCrear;
  document.getElementById('btnBuscarJuego').onclick = ejecutarBuscarJuego;
  document.getElementById('btnCerrarBuscarJuego').onclick = cerrarBuscarJuego;
  $buscarJuegoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') ejecutarBuscarJuego();
  });
  $overlayBuscarJuego.addEventListener('click', e => { if (e.target === $overlayBuscarJuego) cerrarBuscarJuego(); });
  document.getElementById('btnLimpiar').onclick = () => {
    $buscar.value = '';
    clearTimeout(debounceTimer);
    filtro = '';
    resetCargaInfinita();
    render();
    $buscar.focus();
  };
  document.getElementById('btnAleatorio').onclick = abrirAleatorio;
  document.getElementById('carruselPrev').onclick = () => moverCarrusel(-1);
  document.getElementById('carruselNext').onclick = () => moverCarrusel(1);
  $overlayAleatorio.addEventListener('click', e => { if (e.target === $overlayAleatorio) cerrarAleatorio(); });
  document.getElementById('btnAleaDetalle').onclick = () => {
    cerrarAleatorio();
    setTimeout(() => {
      if (aleaActual) abrirDetalle(aleaActual);
    }, 250);
  };
  document.getElementById('btnCancelar').onclick = cerrarModal;
  document.getElementById('btnEliminarPoster').onclick = () => {
    $formulario.fPoster.value = '';
    mostrarToast('Poster eliminado');
  };
  $overlay.addEventListener('click', e => { if (e.target === $overlay) cerrarModal(); });
  $overlayDetalle.addEventListener('click', e => { if (e.target === $overlayDetalle) cerrarDetalle(); });
  document.getElementById('btnCerrarDetalle').onclick = cerrarDetalle;
  document.getElementById('btnCerrarPoster').onclick = cerrarSelectorPoster;
  $overlayPoster.addEventListener('click', e => { if (e.target === $overlayPoster) cerrarSelectorPoster(); });
  document.getElementById('btnCopiarPelicula').onclick = () => {
    const texto = $formulario.fPelicula.value;
    if (!texto) return;
    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  $btnCopiar.onclick = () => {
    if (!detalleActual) return;
    navigator.clipboard.writeText(detalleActual.pelicula).then(() => {
      mostrarToast('Título copiado');
    }).catch(() => {
      mostrarToast('Error al copiar');
    });
  };
  document.getElementById('btnEditarDesdeDetalle').onclick = () => {
    cerrarDetalle();
    setTimeout(() => {
      if (detalleActual) abrirEditar(detalleActual);
    }, 250);
  };
  document.getElementById('btnMenu').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('menuPanel').classList.toggle('abierto');
  };
  document.addEventListener('click', () => document.getElementById('menuPanel').classList.remove('abierto'));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    cerrarDetalle();
    cerrarModal();
    cerrarSelectorPoster();
    cerrarAleatorio();
    cerrarBuscarJuego();
  });
  $formulario.addEventListener('submit', guardar);

  construirFiltros();

  cargar().catch(err => {
    $lista.innerHTML = '';
    const v = document.createElement('div');
    v.className = 'vacio';
    v.textContent = 'No se pudo cargar: ' + err.message;
    $lista.appendChild(v);
  });
</script>

</body>
</html>
