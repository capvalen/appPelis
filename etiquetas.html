<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de etiquetas - Videoteca</title>
  <link rel="icon" type="image/png" href="/assets/martian.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
<style>
  html, body { overflow-x: hidden; }
  .contenedor {
    max-width: 900px;
    margin: 32px auto 48px;
    padding: 0 24px;
  }
  .directorio-buscar {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 24px;
  }
  .contador-directorio {
    max-width: 900px;
    margin: 14px auto 0;
    padding: 0 24px;
    color: #6458e0;
    font-size: .9rem;
  }
  .titulo-mapa {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 24px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #6458e0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mapa-volver {
    max-width: 900px;
    margin: 14px auto 0;
    padding: 0 24px;
  }
  .mapa-cuadritos {
    max-width: 900px;
    margin: 12px auto 0;
    padding: 14px;
    background: #1a1e2a4f;
    border: 1px solid var(--borde);
    border-radius: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  @media (max-width: 640px) {
    .mapa-cuadritos { margin-left: 16px; margin-right: 16px; }
  }
  .mapa-cuadritos .cuadrito {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: var(--superficie-suave);
    position: relative;
    cursor: default;
    transition: transform .1s;
  }
  .mapa-cuadritos .cuadrito:hover { transform: scale(1.4); z-index: 2; }
  .mapa-cuadritos .cuadrito.n1 { background: #9be9a8; }
  .mapa-cuadritos .cuadrito.n2 { background: #40c463; }
  .mapa-cuadritos .cuadrito.n3 { background: #30a14e; }
  .mapa-cuadritos .cuadrito.n4 { background: #216e39; }
  .mapa-cuadritos .cuadrito .tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--texto);
    color: var(--superficie);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
    white-space: normal;
    min-width: 150px;
    max-width: 250px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .15s, visibility .15s;
    z-index: 10;
  }
  .mapa-cuadritos .cuadrito:hover .tooltip { opacity: 1; visibility: visible; }
  .grid-etiquetas {
    max-width: 900px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  @media (max-width: 640px) {
    .grid-etiquetas {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .toolbar, .contador-directorio, .titulo-mapa, .mapa-volver, .grid-etiquetas {
      padding-left: 16px;
      padding-right: 16px;
    }
    .mapa-cuadritos {
      margin-left: 16px;
      margin-right: 16px;
    }
  }
  .tarjeta-etiqueta {
    border: 1px solid var(--borde);
    background: var(--superficie);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .tarjeta-etiqueta.destacada {
    border-color: #f5b301;
    border-width: 2px;
  }
  .tarjeta-etiqueta .nombre {
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: break-word;
    font-weight: 600;
    font-size: .92rem;
  }
  .tarjeta-etiqueta .uso {
    flex-shrink: 0;
    font-size: .78rem;
    color: var(--texto-suave);
    background: var(--morado-mas-claro);
    color: var(--morado-oscuro);
    padding: 2px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .vacio { grid-column: 1 / -1; }
</style>
<script>
  // Aplicar el tema antes del primer render para evitar parpadeo
  (function () {
    var oscuro = localStorage.getItem('modoOscuro') !== 'false';
    if (oscuro) document.documentElement.classList.add('tema-oscuro');
  })();
</script>
<script>
  // Bloquear el menú contextual (clic derecho) en toda la página
  document.addEventListener('contextmenu', e => e.preventDefault(), true);
  // Evitar arrastrar imágenes fuera de la página
  document.addEventListener('dragstart', e => {
    if (e.target.closest('img')) e.preventDefault();
  }, true);
  // Marcar todas las imágenes (incluidas las dinámicas) como no arrastrables
  const marcarImagenes = () => document.querySelectorAll('img').forEach(img => { img.draggable = false; });
  marcarImagenes();
  new MutationObserver(marcarImagenes).observe(document.documentElement, { childList: true, subtree: true });
</script>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <img class="logo" src="/assets/martian.png" alt="Videoteca">
    <h1>Directorio de etiquetas</h1>
  </div>
</header>

<div class="mapa-volver">
  <a class="btn-volver" href="/config.html" style="display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:10px; text-decoration:none; font-weight:600; font-size:.95rem;"><i class="ti ti-arrow-left"></i> Volver</a>
</div>
<h2 class="titulo-mapa"><i class="ti ti-tags"></i> Mapa de etiquetas</h2>
<div class="mapa-cuadritos" id="mapa"></div>

<div class="toolbar">
  <div class="buscar-wrap">
    <input type="text" id="buscar" placeholder="Buscar etiqueta...">
    <button class="btn-limpiar" id="btnLimpiar" title="Limpiar búsqueda"><i class="ti ti-eraser"></i></button>
  </div>
</div>

<div class="contador-directorio" id="contador"></div>
<div class="grid-etiquetas" id="grid"></div>

<div id="toast"></div>
<button id="btnSubir" title="Ir al inicio"><i class="ti ti-chevron-up"></i></button>

<script type="module">
  const BASE_ETIQUETAS = 'https://pb.infocatsoluciones.com/api/collections/is_etiquetas/records';
  const BASE_PELICULAS = 'https://pb.infocatsoluciones.com/api/collections/is_peliculas/records';

  const $grid = document.getElementById('grid');
  const $mapa = document.getElementById('mapa');
  const $buscar = document.getElementById('buscar');
  const $contador = document.getElementById('contador');
  const $btnSubir = document.getElementById('btnSubir');
  const $toast = document.getElementById('toast');

  let etiquetas = [];
  let filtro = '';

  function normalizar(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  async function api(path = '', options = {}) {
    const res = await fetch(BASE_PELICULAS + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) {
      let msg = 'Error ' + res.status;
      try {
        const e = await res.json();
        msg = e.message || msg;
      } catch (_) {}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  }

  async function cargarEtiquetas() {
    let page = 1;
    let items = [];
    while (true) {
      const res = await fetch(BASE_ETIQUETAS + '?perPage=200&sort=etiqueta&page=' + page);
      if (!res.ok) break;
      const data = await res.json();
      items = items.concat(data.items || []);
      if (page >= data.totalPages) break;
      page++;
    }
    etiquetas = items;
  }

  async function contarUsos() {
    const usos = new Map();
    let page = 1;
    while (true) {
      const data = await api('?page=' + page + '&perPage=500&fields=etiquetas');
      for (const r of data.items) {
        const ids = Array.isArray(r.etiquetas) ? r.etiquetas : (r.etiquetas || '').split(',').filter(Boolean);
        for (const id of ids) usos.set(id, (usos.get(id) || 0) + 1);
      }
      if (page >= data.totalPages) break;
      page++;
    }
    return usos;
  }

  function render() {
    const q = normalizar(filtro);
    const visibles = etiquetas
      .filter(e => !q || normalizar(e.etiqueta).includes(q))
      .sort((a, b) => {
        const aIsLetter = /^[a-záéíóúñ]/i.test(a.etiqueta);
        const bIsLetter = /^[a-záéíóúñ]/i.test(b.etiqueta);
        if (aIsLetter && !bIsLetter) return -1;
        if (!aIsLetter && bIsLetter) return 1;
        return a.etiqueta.localeCompare(b.etiqueta, 'es');
      });
    $contador.textContent = visibles.length + ' etiqueta' + (visibles.length === 1 ? '' : 's');
    $grid.innerHTML = '';
    if (!visibles.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Sin etiquetas';
      $grid.appendChild(v);
      return;
    }
    const usos = window.__usosEtiquetas || new Map();
    for (const e of visibles) {
      const usosE = usos.get(e.id) || 0;
      const div = document.createElement('div');
      div.className = 'tarjeta-etiqueta' + (usosE > 0 ? ' destacada' : '');
      div.innerHTML = '<div class="nombre"></div><span class="uso">' + usosE + ' usos</span>';
      div.querySelector('.nombre').textContent = e.etiqueta;
      $grid.appendChild(div);
    }
  }

  // Mapa de cuadraditos estilo GitHub: solo cuadrícula, intensidad según usos
  function renderMapa() {
    $mapa.innerHTML = '';
    const usos = window.__usosEtiquetas || new Map();
    const maxUsos = Math.max(1, ...Array.from(usos.values()));
    for (const e of etiquetas) {
      const usosE = usos.get(e.id) || 0;
      const div = document.createElement('div');
      let nivel = 0;
      if (usosE > 0) {
        nivel = usosE >= maxUsos ? 4 : Math.max(1, Math.min(3, Math.ceil((usosE / maxUsos) * 3)));
      }
      div.className = 'cuadrito' + (nivel ? ' n' + nivel : '');
      div.innerHTML = '<span class="tooltip">' + e.etiqueta + ' · ' + usosE + ' uso' + (usosE === 1 ? '' : 's') + '</span>';
      $mapa.appendChild(div);
    }
  }

  // Ajusta el tooltip para que no se salga del contenedor (clave en móvil)
  function posicionarTooltip(cuadrito) {
    const tooltip = cuadrito.querySelector('.tooltip');
    if (!tooltip) return;
    const mapRect = $mapa.getBoundingClientRect();
    const rect = cuadrito.getBoundingClientRect();
    // Centrado por defecto
    tooltip.style.left = '50%';
    tooltip.style.right = 'auto';
    tooltip.style.transform = 'translateX(-50%)';
    const tRect = tooltip.getBoundingClientRect();
    // Límites reales: borde del contenedor, sin salir del viewport
    const limiteIzq = Math.max(mapRect.left, 0);
    const limiteDer = Math.min(mapRect.right, window.innerWidth);
    if (tRect.left < limiteIzq) {
      // Se sale por la izquierda: anclar al borde izquierdo del contenedor
      tooltip.style.left = (limiteIzq - rect.left) + 'px';
      tooltip.style.transform = 'none';
    } else if (tRect.right > limiteDer) {
      // Se sale por la derecha: anclar al borde derecho del contenedor
      tooltip.style.left = 'auto';
      tooltip.style.right = (limiteDer - rect.right) + 'px';
      tooltip.style.transform = 'none';
    }
  }

  $mapa.addEventListener('mouseover', e => {
    const cuadrito = e.target.closest('.cuadrito');
    if (cuadrito) posicionarTooltip(cuadrito);
  });

  let debounceTimer = null;
  $buscar.addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filtro = e.target.value.trim();
      render();
    }, 300);
  });
  $buscar.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    clearTimeout(debounceTimer);
    filtro = e.target.value.trim();
    render();
  });
  document.getElementById('btnLimpiar').onclick = () => {
    $buscar.value = '';
    clearTimeout(debounceTimer);
    filtro = '';
    render();
    $buscar.focus();
  };
  window.addEventListener('scroll', () => {
    $btnSubir.classList.toggle('visible', window.scrollY > 300);
  });
  $btnSubir.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  cargarEtiquetas().then(() => {
    return contarUsos().then(usos => {
      window.__usosEtiquetas = usos;
      renderMapa();
      render();
    });
  }).catch(err => {
    $grid.innerHTML = '<div class="vacio">No se pudo cargar: ' + err.message + '</div>';
  });
</script>

</body>
</html>
